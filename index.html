function qMagicPic(id){ const pool = MAGIC[id], x = pick(pool), others = shuffle(pool.filter(y => y !== x)).slice(0, 2), all = [x, ...others];
  return eq_({ key:`e:mgp:${x[0]}${others.map(o => o[0])}`, type:'magic', prompt:'잘 듣고 알맞은 그림을 골라요', say:'잘 듣고 알맞은 그림을 골라 봐요', listen:x[0], vis:{ k:'listen' }, opts:all.map(y => y[0]), ans:x[0], pic:true, optHtml:Object.fromEntries(all.map(y => [y[0], phPic(y[2], false)])), hint:`${x[0]}... 다시 들어 봐요`, explain:`${x[0]} = ${x[1]}` }); }

  return eq_({ key:`e:wh:${x.w}`, type:'qa', prompt:'"What is it?" 알맞은 대답을 골라요', say:'왓 이즈 잇? 알맞은 대답을 골라 봐요', listen:'What is it?', vis:{ k:'html', html:phPic(x.e, true) }, opts:[right, ...others.map(o => `It is a ${o.w}.`)], ans:right, sayOpts:true, cols:1, hint:'그림의 이름을 넣어 대답해요', explain:`${right} = 그것은 ${x.k}${hasBatchim(x.k) ? '이에요' : '예요'}.` }); }

function qHowMany(){ const n = rnd(2, 9), [w, k, e] = pick([['apples','사과','🍎'],['stars','별','⭐'],['cats','고양이','🐱'],['balls','공','⚽'],['ducks','오리','🦆']]); const others = shuffle([n - 1, n + 1, n + 2].filter(x => x > 0 && x <= 10)).slice(0, 2);

/* 글 · 시 · 편지 · 극본은 모두 이 앱을 위해 새로 지은 것 (이솝 이야기는 줄거리만 쉽게 다시 씀) */
const sentH = s => `<div class="sent text-q">${esc(s)}</div>`;
const qOf = (key, type, p, { read, html, hint, cols = 1, say }) => { const [q, a, ...w] = p; return kc(key + q + a, type, q, Object.assign({ read, opts:[a, ...w], ans:a, cols, hint, explain:a }, html ? { vis:{ k:'html', html } } : {}, say ? { say } : {})); };
/* 글 + 물음 묶음에서 하나: { t:글, name?, qs:[[물음, 정답, 오답…]] } */
const passQ = (key, type, list, hint, title) => { const p = pick(list), q = pick(p.qs); return qOf(key, type, q, { read:p.t.replace(/\n/g, ' '), html:(p.name || title ? `<span class="eyebrow">${esc(p.name || title)}</span>` : '') + passHTML(p.t), hint }); };
/* 빈칸 문장: [문장(___), 정답, 오답, 오답] */
const blankQ = (key, type, list, hint, prompt = '빈칸에 알맞은 말을 골라요') => { const [s, a, ...w] = pick(list); return kc(key + s, type, prompt, { say:sayBlank(s) + '. 알맞은 말은?', read:s.replace('___', a), vis:{ k:'html', html:blankSent(s) }, opts:[a, ...w], ans:a, cols:w.length > 1 ? 3 : 2, hint, explain:s.replace('___', a) }); };

/* 판이 끝났을 때 진도 판정 */
function judgeCurriculum(b){
  const s = b.cur.subj || 'math', C = CURRS[s], c = curr(s), u = C.units[c.unit]; if (!u || !b.cur) return null;
  // 판을 만든 뒤에 엄마가 진도를 옮겼으면 판정하지 않는다
  if (b.cur.unit !== c.unit || (!b.cur.test && b.cur.lesson !== (u.lessons[c.lesson] || {}).id) || !!b.cur.test !== !!c.test) return null;
  const qs = b.cur.items; const right = qs.filter(x => x.first).length, total = qs.length || 1, rate = right / total;
  const t = todayKey(), nm = SUBJ_NAME[s];
  if (b.cur.test) {
    const pass = rate >= .8; c.tests.push({ unit:c.unit, rate:Math.round(rate * 100), date:t, pass });
    if (pass) { c.medals.push({ unit:c.unit, date:t }); c.unit++; c.lesson = 0; c.test = false; notify('oppa', `🏅 재윤이가 ${nm} ${unitTag(u)} 평가를 통과했어요 (${Math.round(rate * 100)}점)`); notify('mom', `🏅 재윤이가 ${nm} ${unitTag(u)} "${u.name}" 평가를 통과했어요`);
      const nu = C.units[c.unit];
      if (nu && nu.course !== u.course) { const msg = `🎉 재윤이가 ${josa(u.course.title, '을', '를')} 모두 끝냈어요! 내일부터 ${nu.course.title} 시작${nu.course.ebs ? ` (EBS ${nu.course.ebs.name})` : ''}`; notify('mom', msg); notify('oppa', msg); }
      if (!C.units[c.unit]) { notify('mom', `🎉 재윤이가 ${josa(C.title, '을', '를')} 모두 끝냈어요! 이제 ${nm}는 엄마 메뉴의 난이도대로 복습해요`); notify('oppa', `🎉 재윤이가 ${josa(C.title, '을', '를')} 모두 끝냈어요!`); } }
    return { subj:s, test:true, pass, rate:Math.round(rate * 100) / 100, unitIdx:C.units.indexOf(u) };
  }
  const l = u.lessons[c.lesson];
  const pass = rate >= .7, prev = c.done[l.id] || {};
  const passN = (prev.passN || 0) + (pass ? 1 : 0), need = S.pace === 'slow' ? 2 : 1;
  c.done[l.id] = { date:t, rate:Math.round(rate * 100), tries:(prev.tries || 0) + 1, pass, passN };
  if (pass && passN >= need) { if (c.lesson + 1 < u.lessons.length) c.lesson++; else c.test = true; }
  return { subj:s, test:false, pass, rate:Math.round(rate * 100) / 100, lessonId:l.id, unitIdx:C.units.indexOf(u) };
}

/* ---------- 강의는 하루 한 편 ---------- */
function ebsOn(s){ return !!CURRS[s].ebs && (S.ebsOn || {})[s] !== false; }
function dueLecture(s){
  if (!CURRS[s].ebs || !currOn(s) || !ebsOn(s)) return null;
  const c = curr(s); if (c.test) return null;
  // 다른 강의를 봐서 놓친 강의가 있으면 그것부터 (진도가 넘어갔어도)
  const miss = (c.missed || []).find(n => !c.seen[n]); if (miss) return miss;
  const l = currentLesson(s); if (!l || !l.ebs) return null;
  return l.ebs.find(n => !c.seen[n]) || null;
}
/* 수학과 국어 둘 다 새 강의가 필요하면 번갈아 가며 하나만 */
function planLecture(d = day()){
  if (d.lec !== undefined) return d.lec;
  const cand = ['math','kor'].filter(s => dueLecture(s) && !(d.boards[s]));
  let s = null;
  if (cand.length === 2) s = S.lastLec === 'math' ? 'kor' : 'math';
  else if (cand.length === 1) s = cand[0];
  d.lec = s ? { s, n:dueLecture(s), done:false } : null;
  return d.lec;
}
function boardHasLecture(b){ return b && b.cur && b.cur.lec && !curr(b.cur.subj).seen[b.cur.lec]; }

/* 판 만들기 (진도 과목) */
function makeCurrBoard(k, n){
  const d = day(), lec = planLecture(d), need = dueLecture(k);
  const base = { idx:0, correct:0, secs:0, done:false, phase: k === 'eng' ? 'eng' : 'q', intro:false, startedAt:Date.now() };
  // 강의 보는 날은 다른 판을 줄여서 하루 1시간 안팎으로
  if (lec && lec.s !== k) n = Math.max(7, Math.round(n * .5));
  const c0 = curr(k);
  if (!CURRS[k].units[c0.unit]) return Object.assign(base, { qs:baseGen(k, n), finished:true });   // 이 과목 진도를 다 끝낸 뒤
  if (need && !(lec && lec.s === k)) {
    // 오늘 강의는 다른 과목 차례 → 이 과목은 복습하는 날
    return Object.assign(base, { qs:genCurrReview(k, Math.min(n, 12)), waitLec:true });
  }
  const c = curr(k), isLec = !!(lec && lec.s === k);
  const qs = genCurriculum(k, isLec ? Math.min(n, 5) : n);   // 강의 날은 교재로 같이 풀었으니 앱은 5문제만
  if (!c.test) { const due = dueWrong(k); const old = takeDue(due, Math.min(isLec ? 1 : 3, Math.floor(n / 6))); old.forEach((q, i) => qs.splice(Math.min(qs.length, 4 + i * 5), 0, q)); }
  const cl = currentLesson(k);
  return Object.assign(base, { qs, cur:{ subj:k, test:c.test, unit:c.unit, lesson: c.test || !cl ? null : cl.id, items:[], lec: isLec ? lec.n : null } });
}
function markLectureSeen(s, n, mins){
  const c = curr(s); c.seen[n] = { d:todayKey(), mins };
  S.lastLec = s; const d = day(); if (d.lec && d.lec.s === s) d.lec.done = true;
  const li = lectInfo(s, n);
  notify('mom', `📺 재윤이가 EBS ${li.name} ${li.no}강을 봤어요${mins ? ` (${mins}분)` : ''}`);
  notify('oppa', `📺 재윤이가 ${SUBJ_NAME[s]} ${li.no}강 "${li.desc}"을 봤어요${mins ? ` (${mins}분)` : ''}`);
  save();
}

const SUBJS = ['math','kor','eng'];
/* 카드 말하기: 글자 하나면 그대로, [글, 언어] 목록이면 차례로 */
async function sayParts(say){
  if (!Array.isArray(say)) return speak(say);
  const my = ++SEQ;
  for (const [t, lang] of say) { if (my !== SEQ) return; await speak(t, lang); }
}

function currHelpPanel(){
  return `<div class="panel"><h3>EBS 강의는 이렇게 봐요</h3>
    <p style="font-size:15px;line-height:1.6">• 강의는 <b>하루에 한 편</b>만 봐요. 수학 강의 날과 국어 강의 날이 번갈아 와요. 강의 날에는 교재를 강의와 함께 풀기 때문에 그 과목 앱 문제는 5개, 다른 과목과 복습도 절반 정도로 줄여서 하루 1시간 안팎이 되게 해요.<br>

/* ---------- 오빠 메뉴: EBS 강의 바로가기 주소 넣기 ---------- */
function ebsUpcoming(s, k = 4){
  if (!CURRS[s] || !CURRS[s].ebs || !ebsOn(s)) return [];
  const c = curr(s), co = CURRS[s].now, from = co.lectOff + 1, to = co.lectOff + (co.lect || []).length, out = [];
  const due = dueLecture(s); if (due) out.push(due);
  for (let n = from; n <= to && out.length < k; n++) if (!c.seen[n] && !out.includes(n)) out.push(n);
  return out.sort((a, b) => a - b).map(n => lectInfo(s, n)).filter(Boolean);
}

/* ===================== 가족 연결 (Firebase) =====================
   - 한 가족 = families/{fid}. fid는 20자 이상 무작위 → 링크를 아는 가족만 들어올 수 있다.

   - 이 기기에만 남는 것: 역할, 가족 번호, 체험판 날짜, 탭 위치            */
const LOCAL_KEYS = ['local','dayOffset','adultTab','notes','days','v'];

function role(){ return (S.local && S.local.role) || 'all'; }
function linked(){ return !!(S.local && S.local.fid); }

function newFid(){ const a = 'abcdefghijkmnpqrstuvwxyz23456789'; let s = ''; const r = new Uint8Array(22); (crypto || window.msCrypto).getRandomValues(r); r.forEach(x => s += a[x % a.length]); return s; }
function hashStr(str){ str = str == null ? "" : String(str); let h1 = 0xdeadbeef, h2 = 0x41c6ce57; for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909); return (h2 >>> 0).toString(36) + (h1 >>> 0).toString(36) + str.length.toString(36); }

/* 공부 기록이 얼마나 있는지 (스티커 수 + 한 판이라도 끝낸 날 수) — 가족 연결할 때 어느 쪽 기록을 남길지 정한다 */

const SYNCED_KEY = 'jaeyun-synced';
const Sync = {
  db:null, ready:false, status:'off', last:{ s:{}, days:{} }, timer:null, blobCache:{}, blobWait:{}, unsub:[], applying:false,

  synced(){
    if (!this.sy || this.sy.fid !== (S.local && S.local.fid)) {
      let x = null; try { x = JSON.parse(localStorage.getItem(SYNCED_KEY) || 'null'); } catch (e) {}
      this.sy = x && x.fid === (S.local && S.local.fid) ? Object.assign({ s:{}, d:{}, b:{} }, x) : { fid:S.local && S.local.fid, s:{}, d:{}, b:{}, fresh:true };
    }

  },
  saveSynced(){ clearTimeout(this.syT); this.syT = setTimeout(() => { try { const x = Object.assign({}, this.sy); delete x.fresh; localStorage.setItem(SYNCED_KEY, JSON.stringify(x)); } catch (e) {} }, 800); },
  resetSynced(){ this.sy = { fid:S.local && S.local.fid, s:{}, d:{}, b:{}, fresh:true }; try { localStorage.removeItem(SYNCED_KEY); } catch (e) {} },
  async fs(){
    if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    // 전에 로그인한 기기는 인터넷이 없어도 그 로그인을 그대로 쓴다 (처음 한 번만 인터넷으로 로그인)
    const auth = firebase.auth();

  async start(){

  kidSeenAt(){ return Math.max((this.kid && this.kid.at) || 0, this.kidDayAt || 0); },
  /* 알림함: 인터넷이 없거나 아직 연결 전에 생긴 알림은 기기에 모아 두었다가(jaeyun-noteq, 7일까지) 연결되면 올린다 */

  setNoteQ(q){ try { q.length ? localStorage.setItem('jaeyun-noteq', JSON.stringify(q.slice(-80))) : localStorage.removeItem('jaeyun-noteq'); } catch (e) {} },
  addNote(n){

  /* 큰 데이터(사진·녹음)를 blobs로 빼고 짧은 표시로 바꾼다 */

/* 인터넷이 다시 되거나, 앱을 다시 볼 때 · 끌 때 바로 보낸다 */

function agoText(t){
  const m = Math.floor((Date.now() - t) / 60000);
  if (m < 2) return '방금'; if (m < 60) return `${m}분 전`;
  const d = new Date(t), today = todayKey(), dk = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const hm = `${d.getHours() < 12 ? '오전' : '오후'} ${d.getHours() % 12 || 12}:${String(d.getMinutes()).padStart(2, '0')}`;
  if (dk === today) return `오늘 ${hm}`; if (dk === addDays(today, -1)) return `어제 ${hm}`;
  return `${Math.max(2, Math.round((Date.now() - t) / 86400000))}일 전 (${d.getMonth() + 1}/${d.getDate()})`;
}
/* 엄마·오빠 메뉴 맨 위: 기록이 가족에게 안 가고 있으면 알려 준다 */

/* ===================== 폰 알림 (Firebase 클라우드 메시징) =====================
   - 엄마·오빠 폰에서 "이 폰으로 알림 받기"를 누르면 이 폰의 알림 주소(토큰)를 families/{fid}/push/{id}에 저장
     { token, roles:['mom'] 처럼 받을 알림 종류, at, ua }

   - 웹 푸시 키(VAPID 공개키)는 오빠가 설정 탭에 붙여 넣는다 → S.fcmKey (공개돼도 되는 값, 가족 기기에 같이 저장)
   - 알림을 받으면 sw.js가 띄운다 (push 이벤트)                                                  */
/* 2026-10-24: 오빠가 요금제 안 바꾸기로 하고 ntfy 앱(ntfy.js)으로 정함 → 아래 FCM·Apps Script 방식은 꺼 둠 (USE_FCM).
   다시 쓰려면 true로 바꾸고 HANDOFF.md "폰 알림 (Apps Script 방식)" 참고 */
const USE_FCM = false;
const PUSH_LS = 'jaeyun-push';
/* 알림 서버(오빠 구글 계정의 Apps Script, firebase/apps_script.gs)로 알림 보내기.
   알림이 생긴 기기가 바로 보낸다 → 서버가 엄마·오빠 폰으로 앱 알림. 인터넷이 끊겨 못 보낸 건 기기에 잠깐 쌓아 두었다가 다시 (3시간 지나면 버림) */
const RELAY_LS = 'jaeyun-relayq';
const Relay = {
  url(){ const m = S.mail || {}; return m.key && m.url && /^https:\/\/script\.google\.com\/macros\/s\/[^\s]+\/exec$/.test(m.url) ? m.url : ''; },
  q(){ try { return JSON.parse(localStorage.getItem(RELAY_LS) || '[]'); } catch (e) { return []; } },
  setQ(q){ try { localStorage.setItem(RELAY_LS, JSON.stringify(q.slice(-30))); } catch (e) {} },
  send(n){ if (!this.url() || !linked()) return; const q = this.q(); q.push({ to:n.to, text:n.text, at:n.at || Date.now() }); this.setQ(q); this.flush(); },
  flushing:false,
  async flush(){
    const url = this.url(); if (!url || this.flushing) return; this.flushing = true;
    try {
      let q = this.q().filter(x => Date.now() - x.at < 3 * 3600000);
      for (const x of q.slice()) {
        try { await fetch(url, { method:'POST', mode:'no-cors', headers:{ 'Content-Type':'text/plain' }, body:JSON.stringify({ key:S.mail.key, type:'note', to:x.to, text:x.text, at:x.at }) }); q = q.filter(y => y !== x); }
        catch (e) { break; }   // 인터넷이 안 되면 다음에

  },

window.addEventListener('online', () => Relay.flush());
const Push = {
  busy:false, err:'',
  key(){ return (S.fcmKey || window.FCM_VAPID_KEY || '').trim(); },
  sdk(){ return !!(window.firebase && firebase.messaging && 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window); },
  mine(){ try { const x = JSON.parse(localStorage.getItem(PUSH_LS) || 'null'); return x && x.fid === (S.local && S.local.fid) ? x : null; } catch (e) { return null; } },
  setMine(x){ try { x ? localStorage.setItem(PUSH_LS, JSON.stringify(x)) : localStorage.removeItem(PUSH_LS); } catch (e) {} },
  /* off: 꺼짐 · on: 받는 중 · denied: 폰에서 막힘 · nokey: 오빠가 키를 아직 안 넣음 · unsupported: 이 브라우저는 안 됨 · nolink: 가족 연결 전 */
  state(){
    if (!this.sdk()) return 'unsupported';
    if (!linked()) return 'nolink';
    if (Notification.permission === 'denied') return 'denied';
    if (!Relay.url()) return 'noserver';
    if (!this.key()) return 'nokey';
    return this.mine() && Notification.permission === 'granted' ? 'on' : 'off';
  },
  docId(token){ return hashStr(token).slice(0, 24); },
  async token(){
    // 서비스워커가 준비 안 되면 영영 기다리지 않게 15초에서 끊는다
    const limit = (pr, msg) => Promise.race([pr, new Promise((_, no) => setTimeout(() => no(new Error(msg)), 15000))]);
    const reg = await limit(navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready), '앱 준비가 안 됐어요. 앱을 껐다 켜고 다시 해 주세요');
    return limit(firebase.messaging().getToken({ vapidKey:this.key(), serviceWorkerRegistration:reg }), '알림 서버에 연결하지 못했어요. 인터넷을 확인하고 다시 해 주세요');
  },
  async enable(roles){

      await Sync.fs();
      const token = await this.token(); if (!token) throw new Error('알림 주소를 못 받았어요');
      const old = this.mine(); roles = roles || (old && old.roles) || [role()];
      if (old && old.id !== this.docId(token)) { try { await Sync.db.doc(`${Sync.base()}/push/${old.id}`).delete(); } catch (e) {} }
      const id = this.docId(token);
      await Sync.db.doc(`${Sync.base()}/push/${id}`).set({ token, roles, at:Date.now(), who:role(), ua:navigator.userAgent.slice(0, 120) });

  },
  async disable(){

  async setRoles(roles){ const m = this.mine(); if (!m) return; m.roles = roles; this.setMine(m); try { await Sync.db.doc(`${Sync.base()}/push/${m.id}`).set({ roles }, { merge:true }); } catch (e) {} },
  /* 알림 주소는 가끔 바뀐다 → 앱을 열 때 하루 한 번 새로 받아서 저장 */
  async refresh(){
    const m = this.mine(); if (!m || this.state() !== 'on' || Date.now() - (m.at || 0) < 86400000) return;
    try { await this.enable(m.roles); } catch (e) {}
  },
  test(){ notify(role() === 'mom' ? 'mom' : 'oppa', '🔔 알림 테스트: 이 알림이 폰에 오면 성공이에요'); },
};

/* ===================== 펜으로 받아쓰기 (태블릿) ===================== */
function penMode(){ const m = S.dictMode || 'auto'; if (m === 'pen') return true; if (m === 'paper') return false; return Math.min(screen.width, screen.height) >= 600; }

function composePen(dt){
  return new Promise(res => {
    const W = 760, H = 150, cv = document.createElement('canvas'); cv.width = W; cv.height = H * dt.words.length;
    const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height);
    let left = dt.words.length; if (!left) return res(null);
    dt.words.forEach((w, i) => {

      x.strokeStyle = '#EEE'; x.beginPath(); x.moveTo(0, (i + 1) * H - 1); x.lineTo(W, (i + 1) * H - 1); x.stroke();

      const img = new Image(); img.onload = () => {

/* 진한 잉크(글씨)가 있는 사각형. 연한 안내선은 무시. 글씨가 없으면 그림 전체 */
function inkBox(img){
  try {
    const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height, c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d'); x.drawImage(img, 0, 0); const d = x.getImageData(0, 0, w, h).data;
    let x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (let y = 0; y < h; y += 2) for (let xx = 0; xx < w; xx += 2) { const o = (y * w + xx) * 4; if (d[o] < 150 && d[o + 1] < 150) { if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (y < y0) y0 = y; if (y > y1) y1 = y; } }
    if (x1 < 0) return [0, 0, w, h];
    const pad = Math.round(Math.max(w, h) * .02); x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(w, x1 + pad); y1 = Math.min(h, y1 + pad);
    return [x0, y0, Math.max(8, x1 - x0), Math.max(8, y1 - y0)];
  } catch (e) { return [0, 0, img.width, img.height]; }
}

/* 한 주 = 월~일. 새 주가 되면 재윤이 태블릿이 지난주 리포트를 만들어 가족 기록에 남기고,
   엄마·오빠 알림함에 알린다. 메일 주소를 설정해 두면 메일로도 보낸다 (오빠 구글 계정의 Apps Script로). */
function wrongLabel(w){
  const q = w.q || {}; const strip = h => String(h || '').replace(/<br>/g, ' ').replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
  if (w.subj === 'dict') return `받아쓰기 '${q.w}'`;
  if (q.vis && /eq/.test(q.vis.k || '') ) return `${strip(q.vis.html).replace('?', '□')} (답 ${q.ans})`;
  if (q.vis && q.vis.k === 'html' && /class="eq"/.test(q.vis.html)) return `${strip(q.vis.html).replace('?', '□').slice(0, 30)} (답 ${q.ans})`;
  return `${String(q.prompt || '').slice(0, 24)} → ${String(q.ans).slice(0, 20)}`;

function mondayOf(k){ const [y, m, d] = k.split('-').map(Number); const t = new Date(y, m - 1, d); const dow = (t.getDay() + 6) % 7; return addDays(k, -dow); }
function buildWeekReport(mon){

  const days = keys.map(k => S.days[k]).filter(Boolean);
  const studied = keys.filter(k => S.days[k] && Object.values(S.days[k].boards || {}).some(b => b.done)).length;
  const fullDays = keys.filter(k => S.days[k] && S.days[k].done).length;
  const mins = keys.reduce((a, k) => a + minutesOf(S.days[k]), 0);
  const acc = {}; ['kor','math','eng','rev'].forEach(s => acc[s] = [0, 0]);
  days.forEach(dy => Object.entries(dy.boards || {}).forEach(([s, bo]) => { if (!acc[s] || !bo.done) return; acc[s][0] += bo.correct; acc[s][1] += bo.n || (bo.qs || []).length; }));
  const subj = SUBJS.map(s => {
    const c = curr(s), passed = Object.entries(c.done).filter(([, d]) => d.pass && inWeek(d.date)).map(([id]) => id);
    const failed = Object.entries(c.done).filter(([, d]) => !d.pass && inWeek(d.date)).map(([id]) => id);
    const lec = Object.entries(c.seen || {}).filter(([, v]) => inWeek(v.d)).map(([n, v]) => ({ n:+n, mins:v.mins || 0 }));
    return { s, name:SUBJ_NAME[s], now:currLabel(s), passed:passed.length, failed:failed.filter(id => !passed.includes(id)).map(id => lessonById(id).title), medals:c.medals.filter(m => inWeek(m.date)).length, lec, rate:acc[s][1] ? Math.round(acc[s][0] / acc[s][1] * 100) : null };
  });
  const dict = keys.map(k => gradeOf(k)).filter(g => g.graded).map(g => g.score);
  const writes = keys.flatMap(k => Object.values((S.days[k] || {}).writes || {})).filter(w => w.img).length;
  const weak = [...S.wrong].filter(w => w.misses >= 2).sort((a, b) => b.misses - a.misses).slice(0, 3).map(wrongLabel);
  // 한 줄 총평
  const notes = [];
  const avail = keys.filter(k => k >= (S.firstDay || mon)).length;
  if (avail < 7 && studied >= avail - 1) notes.push(`${shortDate(S.firstDay)}에 시작해서 ${studied}일 공부했어요. 좋은 출발이에요!`);
  else if (studied >= 6) notes.push('거의 매일 공부했어요. 정말 꾸준해요!'); else if (studied >= 4) notes.push(`${studied}일 공부했어요.`); else notes.push(`이번 주는 ${studied}일만 공부했어요. 공부 시간 알람을 확인해 주세요.`);
  subj.forEach(x => { if (x.rate !== null && x.rate >= 90) notes.push(`${x.name} 정답률 ${x.rate}%로 아주 잘하고 있어요.`); if (x.rate !== null && x.rate < 65) notes.push(`${x.name}는 ${x.rate}%로 조금 어려워해요. 같이 한 번 봐 주세요.`); if (x.failed.length) notes.push(`${x.name} "${x.failed[0]}" 차시를 다시 연습하고 있어요.`); });
  const shortLec = subj.flatMap(x => x.lec.filter(l => l.mins && l.mins < 20).map(l => `${x.name} ${l.n}강`));
  if (shortLec.length) notes.push(`${shortLec.join(', ')}은 20분보다 짧게 봤어요.`);

}

/* ---------- 문제 기록: 판마다 b.log = [[문제, 정답, 재윤이가 고른 오답, 결과(1 한 번에 · 2 두 번째에 · 0 틀림), 걸린 초, 과목]] ---------- */
const stripTags = h => String(h || '').replace(/<br\s*\/?>/g, ' / ').replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/\s+/g, ' ').trim();
function qBrief(q){
  const v = q.vis || {}; let x = '';
  try {
    if (v.k === 'clock') x = `🕐 시계 ${v.h}시${v.m ? ` ${v.m}분` : ''}`;
    else if (v.k === 'count') x = `${v.e} ${v.n}개`;
    else if (v.k === 'tens') x = `10개씩 묶음 ${v.t}개${v.o ? ` + 낱개 ${v.o}개` : ''}`;
    else if (v.k === 'groups') x = `${v.e} ${v.each}개씩 ${v.g}묶음`;
    else if (v.k === 'pic') x = v.e;
    else if (!['listen', 'eng', 'frac'].includes(v.k)) x = stripTags(visHTML(q));
  } catch (e) {}
  if (x.length > 70) x = x.slice(0, 68) + '…';
  if (x && (q.prompt || '').includes(x)) x = '';
  const listen = q.listen && (v.k === 'listen' || q.eng) ? `🔊 ${q.listen}` : '';
  const opts = q.input === 'choice' && q.opts && q.opts.map(String).join('').length <= 48 ? `[보기 ${q.opts.join(' · ')}]` : '';
  return [q.prompt || '', x, listen, opts].filter(Boolean).join(' · ').slice(0, 200);
}
function logQ(b, q, r){

    (b.log = b.log || []).push([qBrief(q), String(q.ans).slice(0, 60), [...new Set(RUN.wrongs || [])].map(x => String(x).slice(0, 40)).join(' / '), r, secs, q.subj || '']);

function monthStart(k){ return k.slice(0, 8) + '01'; }
function monthEnd(k){ const [y, m] = k.split('-').map(Number); return keyOf(new Date(y, m, 0)); }
function studyPreset(p){
  const t = todayKey(), mon = mondayOf(t), first = S.firstDay || Object.keys(S.days).sort()[0] || t;
  switch (p) {
    case 'today': return [t, t];
    case 'week': return [mon, t];
    case 'lastweek': return [addDays(mon, -7), addDays(mon, -1)];
    case 'month': return [monthStart(t), t];
    case 'lastmonth': { const e = addDays(monthStart(t), -1); return [monthStart(e), e]; }

function lecturesOn(k){ return SUBJS.flatMap(s => Object.entries(curr(s).seen || {}).filter(([, v]) => v.d === k).map(([n, v]) => ({ s, n:+n, mins:Math.min(40, v.mins || 0), info:lectInfo(s, +n) }))); }
function dayMins(k){ const dy = S.days[k], app = minutesOf(dy), lec = lecturesOn(k).reduce((a, x) => a + x.mins, 0); return { app, lec, total:app + lec }; }
function dayLogs(k){ const dy = S.days[k]; if (!dy || !dy.boards) return []; return BOARDS.flatMap(b => ((dy.boards[b.k] || {}).log || []).map(x => ({ k, board:b.k, t:x[0], a:x[1], w:x[2], r:x[3], s:x[4], subj:x[5] || b.k }))); }

    if (svg) svg.classList.add('talking');
    for (const [t, lang] of parts) { if (seq !== SEQ) break; await speak(t, lang); }
    if (my === talkSeq && svg) svg.classList.remove('talking');
  }
  function talk(stage, text){ bubble(stage, text); return say(stage, [[text, 'ko-KR']]); }

  /* ---------- 누르기 ---------- */
  let taps = [], petAt = 0, riddle = null, playN = 0, playDay = '';
  const zoneOf = (svg, ev) => {
    if (!svg || !ev || (!ev.clientX && !ev.clientY)) return 'face';
    const r = svg.getBoundingClientRect(), y = (ev.clientY - r.top) / r.height, x = (ev.clientX - r.left) / r.width;
    if (x < -.05 || x > 1.05 || y < 0 || y > 1.02) return 'body';
    return y < .4 ? 'ears' : y < .77 ? 'face' : 'body';
  };
  /* 공부 끝나기 전에는 12번쯤 놀면 다음 판을 알려 줘요 */
  function needNudge(){
    const t = todayKey(); if (playDay !== t) { playDay = t; playN = 0; }
    playN++;
    const d = day(); if (d.done || !(SCREEN === 'home')) return null;
    if (playN >= 12 && playN % 6 === 0) { const nb = nextBoard(d); return nb || null; }
    return null;
  }
  let dizzyUntil = 0;
  function tap(el, ev){
    if (Date.now() - petAt < 600) return;   // 쓰다듬기 끝난 직후 클릭은 무시
    const svg = bunnyIn(el), stage = el, t = Date.now();
    if (t < dizzyUntil) { fx(stage, ev && ev.clientX, ev && ev.clientY, ['💫'], 1); return; }   // 어지러운 동안은 별만
    taps = taps.filter(x => t - x < 2500); taps.push(t);
    if (riddle && t - riddle.at < 90000) {   // 수수께끼 정답 (공부 안내보다 먼저)
      const r = riddle; riddle = null; needNudge();
      anim(svg, 't-bigjump', 900); setExpr(svg, 'wow', 2600); fx(stage, null, null, ['🎉','⭐','✨'], 6);
      SFX.right();
      const a = r[2] ? `딩동댕! 정답은 ${r[1]}!` : `딩동댕! 정답은 ${josa(r[1], '이야', '야')}!`;
      return talk(stage, a + ' 재윤이 맞혔어?');
    }
    if (taps.length >= 6) {   // 너무 빨리 많이 누르면
      taps = []; dizzyUntil = t + 2200; needNudge();
      anim(svg, 't-spin', 1000); setExpr(svg, 'dizzy', 2200); fx(stage, null, null, ['💫','⭐'], 4);
      tone([[660,0,.12,'sine'],[523,.12,.12,'sine'],[440,.24,.2,'sine']]);
      return talk(stage, fresh(DIZZY_LINES));
    }
    const nb = needNudge();
    if (nb) {
      anim(svg, 't-nod', 700); setExpr(svg, 'wink', 2200);
      const card = document.querySelector(`.board-card[data-k="${nb.k}"]`); if (card) { card.classList.remove('t-call'); void card.offsetWidth; card.classList.add('t-call'); }
      tone([[988,0,.1],[1318,.1,.18]]);
      return talk(stage, pick([`재윤아, 공부 먼저 하고 또 놀자! 오늘은 ${SUBJ_SHORT[nb.k]}부터!`, `${josa(N(), '이', '가')} 여기서 기다릴게! ${SUBJ_SHORT[nb.k]} 하고 와서 또 놀자!`]));
    }
    const zone = zoneOf(svg, ev), x = ev && ev.clientX, y = ev && ev.clientY;
    if (zone === 'ears') {
      anim(svg, 't-flap', 900); setExpr(svg, 'happy', 1600); fx(stage, x, y, ['✨','💗'], 3);
      tone([[1568,0,.06],[1760,.07,.06],[1568,.14,.1]]);
      return talk(stage, fresh(EAR_LINES));
    }
    if (zone === 'body') {
      const dance = Math.random() < .5;
      anim(svg, dance ? 't-dance' : 't-bigjump', dance ? 1200 : 900); setExpr(svg, 'happy', 1800); fx(stage, x, y, ['🎵','🎶','⭐'], 4);
      tone(dance ? [[784,0,.1],[988,.15,.1],[1175,.3,.1],[988,.45,.14]] : [[523,0,.1],[1046,.12,.2]]);
      return talk(stage, fresh(BODY_LINES));
    }
    // 얼굴: 여러 가지 말
    const r = Math.random();
    if (r < .18) {
      riddle = Object.assign([...pick(RIDDLES)], { at:t }); riddle[0] = txt(riddle[0]);
      anim(svg, 'wiggle', 500); setExpr(svg, 'think', 3500); fx(stage, null, null, ['❓'], 2);
      tone([[880,0,.1],[1175,.12,.16]]);
      bubble(stage, '🤔 ' + riddle[0] + ` (${josa(N(), '을', '를')} 한 번 더 누르면 정답!)`);
      return say(stage, [[`${N()} 수수께끼!`, 'ko-KR'], [riddle[0], 'ko-KR']]);
    }
    if (r < .32) {
      const [e, k] = pick(EN_LINES);
      anim(svg, 'hop', 600); setExpr(svg, 'wink', 2400); fx(stage, x, y, ['💬','✨'], 3);
      tone([[1318,0,.08],[1568,.08,.12]]);
      bubble(stage, `${e}\n(${k})`);
      return say(stage, [[e, 'en-US'], [k, 'ko-KR']]);
    }
    const ctx = contextLines();
    const line = r < .62 && ctx.length ? fresh(ctx) : fresh(POKE_LINES);
    anim(svg, Math.random() < .5 ? 'hop' : 't-shy', 700); setExpr(svg, pick(['happy','wow','wink']), 1800); fx(stage, x, y, ['💗','✨','🥕'], 3);
    tone([[1318,0,.08],[1568,.08,.12]]);
    return talk(stage, line);
  }

  /* ---------- 쓰다듬기: 길게 누르거나 문지르기 ---------- */
  let hold = null;
  function pet(){
    if (!hold || hold.petted) return;
    hold.petted = true; petAt = Date.now();
    const svg = bunnyIn(hold.el);
    svg && svg.classList.add('t-purr'); setExpr(svg, 'love', 999999);
    tone([[392,0,.25,'sine',.08],[440,.25,.25,'sine',.08],[392,.5,.3,'sine',.08]]);
    talk(hold.el, fresh(PET_LINES));
    hold.heart = setInterval(() => { if (hold) fx(hold.el, hold.x, hold.y, ['💗','💕','💖'], 1); }, 260);
  }
  function endHold(){
    if (!hold) return;
    clearTimeout(hold.timer); clearInterval(hold.heart);
    if (hold.petted) { petAt = Date.now(); const svg = bunnyIn(hold.el); if (svg) { svg.classList.remove('t-purr'); setExpr(svg, 'happy', 1500); } }
    hold = null;
  }
  document.addEventListener('pointerdown', ev => {
    const el = ev.target.closest && ev.target.closest('.tori-stage'); if (!el) return;
    endHold();
    hold = { el, x:ev.clientX, y:ev.clientY, sx:ev.clientX, sy:ev.clientY, dist:0, petted:false };
    hold.timer = setTimeout(pet, 600);
  });
  document.addEventListener('pointermove', ev => {
    if (!hold) return;
    hold.dist += Math.hypot(ev.clientX - hold.x, ev.clientY - hold.y); hold.x = ev.clientX; hold.y = ev.clientY;
    if (!hold.petted && hold.dist > 70) pet();
  });
  ['pointerup','pointercancel'].forEach(t => document.addEventListener(t, endHold));
  document.addEventListener('contextmenu', ev => { if (ev.target.closest && ev.target.closest('.tori-stage')) ev.preventDefault(); });

  /* ---------- 가만히 있을 때 혼자 꼼지락 (소리 없이) ---------- */
  let lastTouch = Date.now();
  ['pointerdown','keydown'].forEach(t => document.addEventListener(t, () => lastTouch = Date.now(), true));
  setInterval(() => {
    if (!['home','room'].includes(SCREEN) || document.hidden || hold || Date.now() - lastTouch < 12000) return;
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const svg = document.querySelector('.tori-stage svg.bunny'); if (!svg || svg.classList.contains('talking')) return;
    const h = now().getHours(), r = Math.random();
    if (h >= 21 && r < .5) { setExpr(svg, 'sleepy', 2500); anim(svg, 't-nod', 700); return; }
    if (r < .35) anim(svg, 't-flap', 900);
    else if (r < .6) anim(svg, 'wiggle', 500);
    else if (r < .8) { anim(svg, 'hop', 600); }
    else setExpr(svg, 'wink', 900);
  }, 9000);

  return { tap, talk, contextLines, RIDDLES, _state:() => ({ taps:taps.length, playN, riddle:!!riddle }) };
})();

/* 첫 화면 (모든 내용이 준비된 뒤에) */
(function boot(){
  // 카카오톡 안의 브라우저에서는 기록이 따로 저장되고 바탕화면 설치도 안 돼요 → 크롬으로 열기 안내
  if (/KAKAOTALK/i.test(navigator.userAgent)) {
    const url = location.href;
    app().innerHTML = `<section class="screen" style="justify-content:center;align-items:center;text-align:center">
      ${stageHTML(170, { expr:'wow', size:130 })}
      <h2>크롬에서 열어 주세요!</h2>
      <p class="bubble" style="font-size:19px">카카오톡 안에서 열면 기록이 따로 저장되고<br>바탕화면에 앱을 놓을 수 없어요.</p>
      <a class="btn big" href="kakaotalk://web/openExternal?url=${encodeURIComponent(url)}">크롬(인터넷)으로 열기</a>
      <p class="muted" style="font-size:15px">버튼이 안 되면 오른쪽 위 ⋮ 를 누르고<br>"다른 브라우저로 열기"를 눌러요.</p>
    </section>`;
    return;
  }
  const m = location.hash.match(/#join=([a-z0-9]{20,})/);
  if (m && !(S.local && S.local.fid === m[1])) { JOIN_FID = m[1]; return go('join'); }
  if (linked()) { Sync.start().then(() => { if (SCREEN === 'adult' || SCREEN === 'home') refreshIfIdle(); if (role() !== 'kid') Push.refresh(); }); if (role() !== 'kid') { S.adultTab = S.adultTab === 'set' ? 'set' : role(); return go('adult'); } }
  go('home');
})();

</script>

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
