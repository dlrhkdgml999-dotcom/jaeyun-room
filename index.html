<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>재윤이 공부방</title>
<meta name="theme-color" content="#FFF4F7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="재윤이 공부방">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}
/* Layout: one phone-width column, screens swap in place; pastel strawberry-milk world, single light theme by choice */
:root{
  color-scheme: light;
  --bg:#FFF4F7;          /* 딸기우유 */
  --paper:#FFFFFF;
  --ink:#5B3A4A;         /* 따뜻한 자두색 글씨 */
  --ink-soft:#9B7C8B;
  --line:#F6D5E0;
  --pink:#FF8FB1; --pink-deep:#EE5F8D; --pink-pale:#FFE1EA;
  --sky:#8CC9FF;  --sky-deep:#3E93E0;  --sky-pale:#E3F2FF;
  --mint:#7FD8BE; --mint-deep:#2FA884; --mint-pale:#DDF6EE;
  --lav:#C3ADF2;  --lav-deep:#8A67D6;  --lav-pale:#EFE8FF;
  --butter:#FFE08A; --butter-deep:#E7A500; --butter-pale:#FFF5D6;
  --good:#2FA884; --bad:#E5577E;
  --f-display:'Jua','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  --f-body:'Gowun Dodum','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  --r-lg:28px; --r-md:20px; --r-sm:14px;
  --shadow: 0 4px 0 var(--line);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--lav-deep);outline-offset:3px}
input,select{font:inherit;color:var(--ink)}
.app{max-width:480px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column}
.screen{display:flex;flex-direction:column;gap:16px;flex:1}
.disp{font-family:var(--f-display);font-weight:400;letter-spacing:0}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:30px} h2{font-size:24px} h3{font-size:20px}
p{margin:0}
.muted{color:var(--ink-soft)}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}

/* ---------- 공통 버튼 ---------- */
.btn{font-family:var(--f-display);font-size:22px;padding:14px 22px;border-radius:999px;background:var(--pink);color:#fff;box-shadow:0 5px 0 var(--pink-deep);transition:transform .08s, box-shadow .08s;min-height:58px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink-deep)}
.btn.big{font-size:26px;min-height:68px;width:100%}
.btn.mint{background:var(--mint-deep);box-shadow:0 5px 0 #1F7E62}
.btn.sky{background:var(--sky-deep);box-shadow:0 5px 0 #2A6FB0}
.btn.lav{background:var(--lav-deep);box-shadow:0 5px 0 #6646AE}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.small{font-size:17px;min-height:44px;padding:8px 16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:48px;height:48px;border-radius:50%;background:var(--paper);border:2px solid var(--line);display:grid;place-items:center;box-shadow:0 3px 0 var(--line);flex:none}
.icon-btn svg{width:24px;height:24px}
.speak-btn{width:60px;height:60px;border-radius:50%;background:var(--butter);box-shadow:0 4px 0 var(--butter-deep);display:grid;place-items:center;flex:none}
.speak-btn svg{width:30px;height:30px}
.speak-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--butter-deep)}

/* ---------- 토끼 ---------- */
.bunny{display:block;overflow:visible}
.bunny .ear-l{transform-origin:72px 100px;animation:earL 4s ease-in-out infinite}
.bunny .ear-r{transform-origin:128px 100px;animation:earR 4s ease-in-out infinite}
@keyframes earL{0%,85%,100%{transform:rotate(0)}90%{transform:rotate(-8deg)}}
@keyframes earR{0%,80%,100%{transform:rotate(0)}86%{transform:rotate(9deg)}}
.hop{animation:hop .6s ease-in-out 2}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px) scale(1.03)}}
.wiggle{animation:wig .5s ease-in-out}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.stage{position:relative;border-radius:var(--r-lg);display:grid;place-items:center;overflow:hidden}
.bg-none{background:radial-gradient(circle at 50% 120%, var(--pink-pale) 0 55%, transparent 56%)}
.bg-sky{background:radial-gradient(circle at 20% 30%, #fff 0 18px, transparent 19px),radial-gradient(circle at 30% 26%, #fff 0 24px, transparent 25px),radial-gradient(circle at 78% 22%, #fff 0 16px, transparent 17px),radial-gradient(circle at 86% 26%, #fff 0 22px, transparent 23px),linear-gradient(#BFE3FF,#E9F5FF)}
.bg-berry{background:radial-gradient(circle, #FF9DB8 0 5px, transparent 6px) 0 0/34px 34px, radial-gradient(circle, #fff 0 3px, transparent 4px) 17px 17px/34px 34px, #FFD3E0}
.bg-night{background:radial-gradient(circle, #FFF6C8 0 2px, transparent 3px) 0 0/40px 40px, radial-gradient(circle, #fff 0 1.5px, transparent 2.5px) 20px 14px/52px 52px, linear-gradient(#3D3A7A,#6B5BB0)}
.bg-sea{background:radial-gradient(circle, rgba(255,255,255,.7) 0 6px, transparent 7px) 10px 0/60px 70px, radial-gradient(circle, rgba(255,255,255,.5) 0 3px, transparent 4px) 40px 30px/60px 70px, linear-gradient(#7FD3F0,#3E93E0)}
.bg-candy{background:repeating-linear-gradient(45deg, #FFE1EA 0 18px, #FFF5D6 18px 36px, #DDF6EE 36px 54px, #EFE8FF 54px 72px)}

/* ---------- 말풍선 ---------- */
.bubble{position:relative;background:var(--paper);border:2.5px solid var(--line);border-radius:22px;padding:12px 16px;font-family:var(--f-display);font-size:21px;line-height:1.35}
.bubble.left::after{content:"";position:absolute;left:-12px;top:22px;border:10px solid transparent;border-right-color:var(--line);border-left:0}

/* ---------- 홈 ---------- */
.home-top{display:flex;align-items:center;gap:10px}
.date-chip{font-family:var(--f-display);font-size:17px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:6px 14px}
.sticker-chip{font-family:var(--f-display);font-size:18px;background:var(--butter-pale);border:2px solid var(--butter);border-radius:999px;padding:6px 14px;display:flex;align-items:center;gap:6px}
.hero{display:grid;grid-template-columns:132px 1fr;gap:6px;align-items:center}
.hero .stage{height:150px}
.alarm-banner{background:var(--butter-pale);border:2.5px dashed var(--butter-deep);border-radius:var(--r-md);padding:12px 16px;font-family:var(--f-display);font-size:19px;display:flex;align-items:center;gap:10px}
.boards{display:grid;gap:12px}
.board-card{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-radius:var(--r-md);background:var(--paper);border:2.5px solid var(--line);box-shadow:var(--shadow);text-align:left;width:100%}
.board-card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.board-card .badge{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-family:var(--f-display);font-size:24px;color:#fff}
.board-card .t{font-family:var(--f-display);font-size:22px;line-height:1.2}
.board-card .s{font-size:15px;color:var(--ink-soft)}
.board-card .state{font-family:var(--f-display);font-size:16px;padding:6px 12px;border-radius:999px;background:var(--pink-pale);color:var(--pink-deep);white-space:nowrap}
.board-card.next{border-color:var(--pink);box-shadow:0 4px 0 var(--pink)}
.board-card.next .state{background:var(--pink);color:#fff}
.board-card.done{background:#FFFBFC}
.board-card.done .state{background:var(--mint-pale);color:var(--mint-deep)}
.board-card.doing .state{background:var(--butter-pale);color:var(--butter-deep)}
.k-kor{background:var(--pink)} .k-math{background:var(--sky-deep)} .k-eng{background:var(--mint-deep)} .k-rev{background:var(--lav-deep)}
.home-nav{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nav-tile{background:var(--paper);border:2.5px solid var(--line);border-radius:var(--r-md);padding:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:20px}
.nav-tile .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:24px}
.nav-tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.grown-up{align-self:center;font-size:15px;color:var(--ink-soft);padding:10px 16px;display:flex;align-items:center;gap:6px}
.grown-up svg{width:18px;height:18px}
.next-item{background:var(--paper);border:2.5px solid var(--line);border-radius:var(--r-md);padding:12px 16px;display:grid;gap:8px}
.meter{height:14px;border-radius:999px;background:var(--pink-pale);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--pink-deep))}

/* ---------- 공부판 ---------- */
.q-top{display:flex;align-items:center;gap:12px}
.track{flex:1;position:relative;height:40px}
.track .rail{position:absolute;left:0;right:0;top:16px;height:10px;border-radius:999px;background:var(--paper);border:2px solid var(--line)}
.track .fill{position:absolute;left:0;top:16px;height:10px;border-radius:999px;background:var(--pink);transition:width .4s}
.track .runner{position:absolute;top:-6px;width:40px;height:44px;transform:translateX(-50%);transition:left .4s}
.track .goal{position:absolute;right:-6px;top:6px;font-size:24px}
.q-card{background:var(--paper);border:2.5px solid var(--line);border-radius:var(--r-lg);padding:20px 18px;display:grid;gap:16px;box-shadow:var(--shadow)}
.q-head{display:flex;align-items:center;gap:12px}
.q-prompt{font-family:var(--f-display);font-size:24px;line-height:1.3;flex:1}
.q-visual{display:grid;place-items:center;min-height:120px;text-align:center}
.pic{font-size:96px;line-height:1.1}
.sent{font-family:var(--f-display);font-size:27px;line-height:1.5}
.sent .blank{display:inline-block;min-width:3.4em;border-bottom:4px dashed var(--pink);margin:0 4px}
.options{display:grid;gap:12px}
.options.cols3{grid-template-columns:repeat(3,1fr)}
.options.cols2{grid-template-columns:1fr 1fr}
.opt{background:var(--paper);border:3px solid var(--line);border-radius:var(--r-md);min-height:72px;padding:10px 12px;font-family:var(--f-display);font-size:28px;box-shadow:0 4px 0 var(--line);display:flex;align-items:center;justify-content:center;gap:8px;line-height:1.25}
.opt.text-long{font-size:23px}
.opt.four{font-size:22px;padding:8px 4px;white-space:nowrap}
.opt.pic-opt{font-size:64px;min-height:104px}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.right{border-color:var(--good);background:var(--mint-pale);box-shadow:0 4px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:#FFF0F4;animation:wig .4s}
.opt.dim{opacity:.4}
.opt .say{width:40px;height:40px;border-radius:50%;background:var(--butter);display:grid;place-items:center;flex:none}
.opt .say svg{width:20px;height:20px}
.swatch{width:58px;height:58px;border-radius:50%;border:3px solid var(--line)}
.feedback{display:flex;align-items:center;gap:10px;min-height:56px}
.feedback .bubble{flex:1;font-size:19px}
.hint-box{background:var(--butter-pale);border:2.5px dashed var(--butter-deep);border-radius:var(--r-md);padding:12px 14px;display:grid;gap:10px;justify-items:center;text-align:center;font-family:var(--f-display);font-size:19px}

/* 펜 받아쓰기 */
.pen-wrap{display:grid;gap:10px;justify-items:center;width:100%}
.pen-canvas{width:100%;height:190px;border:3px solid var(--mint);border-radius:var(--r-md);background:#fff;touch-action:none;cursor:crosshair}

/* 눈 건강 */
.eye-overlay{align-items:center}
.eye-card{background:var(--paper);border-radius:var(--r-lg);padding:22px 20px;max-width:440px;width:100%;display:grid;gap:14px;justify-items:center;text-align:center}
.eye-list{list-style:none;padding:0;margin:0;display:grid;gap:6px;text-align:left;font-size:17px}
.eye-tip{background:var(--mint-pale);color:#1F7E62;border-radius:999px;padding:8px 16px;font-family:var(--f-display);font-size:17px}
.eye-timer{position:relative;display:grid;place-items:center}
.eye-timer span{position:absolute;font-size:52px;color:var(--mint-deep)}

/* 가족 연결 */
.role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-self:stretch}
.role-btn{background:var(--paper);border:3px solid var(--line);border-radius:var(--r-md);padding:14px 8px;display:grid;gap:4px;justify-items:center;box-shadow:var(--shadow);font-family:var(--f-display);font-size:20px}
.role-btn .muted{font-family:var(--f-body);font-size:13px}
.adult-peek{background:var(--lav-pale);color:#5E4A8E;border-radius:var(--r-sm);padding:10px 14px;font-size:15px;text-align:left;width:100%}

/* 수학 진도 */
.lesson-card{display:grid;gap:8px;justify-items:center;text-align:center;background:var(--paper);border:2.5px solid var(--line);border-radius:var(--r-md);padding:14px 16px;align-self:stretch}
.lesson-card.won{border-color:var(--butter-deep);background:linear-gradient(135deg,var(--butter-pale),var(--pink-pale))}
.eyebrow{font-family:var(--f-display);font-size:15px;color:var(--sky-deep);letter-spacing:.02em}
.concept{background:var(--paper);border:2.5px solid var(--line);border-radius:var(--r-lg);padding:18px;display:grid;gap:16px;box-shadow:var(--shadow)}
.concept-ill{display:grid;place-items:center;min-height:180px;gap:10px}
.concept-ill svg.draw{width:min(100%,560px)!important;height:auto}
.concept-ill .row svg.draw{width:auto!important}
a.btn{text-decoration:none}
.concept-text{display:flex;gap:12px;align-items:center}
.concept-text p{flex:1;font-family:var(--f-display);font-size:22px;line-height:1.5;word-break:keep-all}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)} .dots i.on{background:var(--pink);width:28px;border-radius:999px}
.unit-card{background:var(--paper);border:2.5px solid var(--line);border-radius:var(--r-md);padding:14px 16px;display:grid;gap:10px}
.unit-card.now{border-color:var(--pink);box-shadow:0 4px 0 var(--pink)} .unit-card.next{opacity:.65}
.unit-no{width:36px;height:36px;border-radius:12px;background:var(--sky-deep);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:20px}
.lesson-dots{display:flex;flex-wrap:wrap;gap:8px}
.ldot{min-width:44px;height:44px;border-radius:999px;border:2.5px solid var(--line);background:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:17px;padding:0 10px;color:var(--ink-soft)}
.ldot.ok{background:var(--mint-pale);border-color:var(--mint-deep);color:var(--mint-deep)} .ldot.cur{background:var(--pink);border-color:var(--pink-deep);color:#fff;animation:pulse 1.4s infinite}
.ldot.test{border-style:dashed} .ldot[disabled]{opacity:.6}
.map-tile{display:flex;align-items:center;gap:12px;background:var(--paper);border:2.5px solid var(--sky);border-radius:var(--r-md);padding:12px 16px;box-shadow:0 4px 0 var(--sky);width:100%}
.mini-dots{display:flex;gap:5px} .mini-dots i{width:12px;height:12px;border-radius:50%;background:var(--line)} .mini-dots i.ok{background:var(--mint-deep)} .mini-dots i.cur{background:var(--pink)} .mini-dots i.t{border-radius:3px}
.vis-html{display:grid;place-items:center;gap:10px;width:100%}
.cls-grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:360px}
table.pv{border-collapse:collapse;font-family:var(--f-display);font-size:24px;text-align:center}
table.pv th{font-size:15px;color:var(--ink-soft);padding:6px 12px;font-weight:400}
table.pv td{padding:6px 14px;border:2px solid var(--line);min-width:44px}
table.pv td.carry{border:0;font-size:16px;color:var(--pink-deep)} table.pv tr.sum td{border-top:3px solid var(--ink)}
.qbox-inline{display:inline-grid;place-items:center;width:1.3em;height:1.3em;border:3px dashed var(--pink);border-radius:50%;color:var(--pink-deep)}

/* 난이도 설정 */
.lvl-row{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center}
.lvl-row select{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-family:var(--f-display);font-size:18px;min-width:0;width:100%}
.lvl-tip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:var(--r-sm);padding:10px 12px;font-size:15px}
.lvl-tip.up{background:var(--mint-pale)} .lvl-tip.down{background:var(--butter-pale)}

/* 학년별 문제 */
.text-q{font-size:27px;line-height:1.55;text-align:center;word-break:keep-all}
.big-word{font-family:var(--f-display);font-size:44px;color:var(--ink)}
.groups{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:340px}
.grp-box{border:3px dashed var(--sky);border-radius:16px;padding:4px 8px;font-size:26px;letter-spacing:2px;background:var(--sky-pale)}
.frac{display:inline-grid;grid-template-rows:auto auto;justify-items:center;line-height:1.05;vertical-align:middle;font-family:var(--f-display)}
.frac>span:first-child{border-bottom:3px solid currentColor;padding:0 6px}
.eq .frac{font-size:.85em}

/* 숫자판 */
.answer-box{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-display);font-size:24px}
.answer-box .slot{min-width:110px;height:72px;border-radius:var(--r-md);border:3px solid var(--sky);background:var(--sky-pale);display:grid;place-items:center;font-size:44px;color:var(--sky-deep)}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.numpad button{min-height:62px;border-radius:var(--r-md);background:var(--paper);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);font-family:var(--f-display);font-size:30px}
.numpad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.numpad .ok{background:var(--sky-deep);color:#fff;border-color:var(--sky-deep);box-shadow:0 4px 0 #2A6FB0;font-size:24px}
.numpad .del{font-size:20px}

/* 글자 블록 */
.slots{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;min-height:76px}
.slots .s{width:68px;height:72px;border-radius:var(--r-sm);border:3px dashed var(--pink);display:grid;place-items:center;font-family:var(--f-display);font-size:38px;background:var(--pink-pale)}
.slots .s.filled{border-style:solid;background:var(--paper)}
.tiles{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.tiles button{width:72px;height:72px;border-radius:var(--r-sm);background:var(--butter-pale);border:3px solid var(--butter);box-shadow:0 4px 0 var(--butter-deep);font-family:var(--f-display);font-size:36px}
.tiles button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--butter-deep)}
.tiles button.used{visibility:hidden}

/* 수학 그림 */
.dots{display:flex;flex-direction:column;gap:6px;align-items:center}
.frame{display:grid;grid-template-columns:repeat(5,30px);gap:4px;padding:6px;border:2.5px solid var(--line);border-radius:12px;background:#fff}
.frame i{width:30px;height:30px;border-radius:50%;background:#F4EEF1;display:block;position:relative}
.frame i.a{background:var(--pink)} .frame i.b{background:var(--mint)}
.frame i.x::after{content:"";position:absolute;left:4px;right:4px;top:13px;height:4px;background:var(--ink);border-radius:2px;transform:rotate(-40deg)}
.frames{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

function now(){ const d = new Date(); d.setDate(d.getDate() + (S.dayOffset || 0)); return d; }
function keyOf(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function todayKey(){ return keyOf(now()); }
function addDays(k, n){ const [y,m,d] = k.split('-').map(Number); const t = new Date(y, m - 1, d); t.setDate(t.getDate() + n); return keyOf(t); }
function korDate(d){ return `${d.getMonth() + 1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`; }
function shortDate(k){ const [, m, d] = k.split('-').map(Number); return `${m}/${d}`; }

}

let AC = null;
function tone(seq){
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t0 = AC.currentTime;
    seq.forEach(([f, st, dur, type = 'triangle', vol = .16]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0 + st); g.gain.linearRampToValueAtTime(vol, t0 + st + .02);
      g.gain.exponentialRampToValueAtTime(.001, t0 + st + dur);
      o.connect(g).connect(AC.destination); o.start(t0 + st); o.stop(t0 + st + dur + .05);
    });
  } catch (e) {}
}

let curAudio = null, speakTimer = null, SEQ = 0;
function stopSound(){
  try { if (curAudio) { curAudio.pause(); curAudio = null; } } catch (e) {}

function speak(text, lang = 'ko-KR', rate){

  const list = langVoices(lg); if (!list.length) return null;
  if (name) { const v = list.find(v => v.name === name); if (v) return v; }

  return list.find(v => soft.test(v.name) && !v.localService) || list.find(v => soft.test(v.name)) || list.find(v => !v.localService) || list[0];

function playClip(src){
  return new Promise(res => {
    try {
      stopSound();
      const a = new Audio(src); curAudio = a;
      let done = false; const fin = () => { if (!done) { done = true; res(true); } };

function genKorBase(n){

  const out = []; const used = new Set();
  for (let i = 0; out.length < n && i < n * 3; i++) {
    const t = order[i % order.length];
    let q;
    if (t === 'pic') q = qPic(pics.pop() || pick(PIC_WORDS));

function dueWrong(subj){ const t = todayKey(); return S.wrong.filter(w => w.subj !== 'dict' && w.due <= t && w.served !== t && (!subj || w.subj === subj)); }
/* 많이 틀린 것, 오래 기다린 것부터 */
function takeDue(list, n){
  const t = todayKey();
  const picked = list.sort((a, b) => (b.misses - a.misses) || a.due.localeCompare(b.due)).slice(0, n);
  picked.forEach(w => w.served = t);
  return picked.map(w => Object.assign(JSON.parse(JSON.stringify(w.q)), { rev:w.id }));
}
function genReview(n){
  const due = takeDue(dueWrong(), n);
  const out = [...due];
  const fill = n - out.length;
  if (fill > 0) {
    const extra = [...genKor(Math.ceil(fill / 3)), ...genMath(Math.ceil(fill / 3)), ...genEng(Math.ceil(fill / 3))];
    shuffle(extra).slice(0, fill).forEach(q => { if (!out.some(o => o.key === q.key)) out.push(q); });
  }
  return shuffle(out);
}
/* soft: 힌트 보고 두 번째에 맞힌 문제 — 한 번만 더 맞히면 목록에서 빠진다 */
function addWrong(q, soft){
  const t = todayKey();
  const id = q.rev || q.key;
  const w = S.wrong.find(x => x.id === id);
  if (w) { w.streak = 0; w.due = addDays(t, 1); w.misses = (w.misses || 1) + (soft ? 0 : 1); w.last = t; }
  else { const clean = JSON.parse(JSON.stringify(q)); delete clean.rev; S.wrong.push({ id, subj:q.subj, q:clean, due:addDays(t, soft ? 2 : 1), streak:soft ? 1 : 0, misses:soft ? 0 : 1, added:t, last:t }); }
}
function reviewRight(q){
  const w = S.wrong.find(x => x.id === q.rev); if (!w) return;
  w.streak++; if (w.streak >= 2) S.wrong = S.wrong.filter(x => x !== w); else w.due = addDays(todayKey(), 3);
}

/* ---------- 받아쓰기 ---------- */
function pickDict(n){
  const t = todayKey();
  const again = S.wrong.filter(w => w.subj === 'dict' && w.due <= t).map(w => w.q.w);
  const rest = shuffle(dictBank().filter(w => !again.includes(w))).sort((a, b) => (S.dictUsed[a] || '').localeCompare(S.dictUsed[b] || ''));
  const words = [...again, ...rest].slice(0, n);
  words.forEach(w => S.dictUsed[w] = t);
  return words;
}

function compressImage(file, max = 1000){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const sc = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .62)); };
      img.onerror = rej; img.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

let RECORDING = null, REC = null, CHUNKS = [];
async function startRec(target){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    CHUNKS = []; REC = new MediaRecorder(stream);
    REC.ondataavailable = e => CHUNKS.push(e.data);
    REC.onstop = () => { stream.getTracks().forEach(t => t.stop()); const blob = new Blob(CHUNKS, { type:REC.mimeType || 'audio/webm' }); blobToData(blob).then(data => { setAudio(target, data); }); };
    REC.start(); RECORDING = target; go('adult');
  } catch (e) {
    toast('이 화면에서는 바로 녹음이 안 돼요. "파일 올리기"로 녹음 파일을 올려 주세요.');
  }
}
function stopRec(){ try { REC && REC.stop(); } catch (e) {} RECORDING = null; }
function blobToData(blob){ return new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(blob); }); }
function setAudio(target, data){
  if (target === 'praise') { S.praise = Object.assign(S.praise || {}, { audio:data, at:Date.now() }); toast('칭찬 녹음을 저장했어요'); }
  else { S.voices[target] = data; toast(`엄마 목소리 #${MOM_LINES.findIndex(l => l.id === target) + 1}을 저장했어요`); }
  save(); go('adult');
}

function confetti(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('canvas.confetti').forEach(x => x.remove());
  const c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
  setTimeout(() => c.remove(), 3500);
  const ctx = c.getContext('2d'); const W = c.width = innerWidth, H = c.height = innerHeight;
  const cols = ['#FF8FB1','#7FD8BE','#8CC9FF','#FFE08A','#C3ADF2'];
  const ps = Array.from({ length:90 }, () => ({ x:W / 2 + (Math.random() - .5) * 80, y:H * .35, vx:(Math.random() - .5) * 9, vy:-Math.random() * 11 - 3, r:Math.random() * 6 + 4, c:pick(cols), a:Math.random() * 6, s:Math.random() < .5 }));
  let f = 0;
  (function tick(){ ctx.clearRect(0, 0, W, H); ps.forEach(p => { p.vy += .32; p.x += p.vx; p.y += p.vy; p.a += .15; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; if (p.s) { ctx.beginPath(); ctx.arc(0, 0, p.r / 1.6, 0, 7); ctx.fill(); } else ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
    if (++f < 110) requestAnimationFrame(tick); else c.remove(); })();
}

/* 수 모형: 백(10×10 판), 십(막대), 일(작은 정육면체) */
function baseTenSVG(h, t, o, opt = {}){
  const u = opt.unit || 9, gap = 10, pad = 6;
  const hw = u * 10, rows = [];
  let x = pad, svg = '';
  for (let i = 0; i < h; i++) {
    svg += `<g transform="translate(${x} ${pad})"><rect width="${hw}" height="${hw}" rx="3" fill="${C.skyD}" stroke="${C.ink}" stroke-width="2"/>`;
    for (let k = 1; k < 10; k++) svg += `<line x1="${k * u}" y1="0" x2="${k * u}" y2="${hw}" stroke="#BFE0FF" stroke-width="1"/><line x1="0" y1="${k * u}" x2="${hw}" y2="${k * u}" stroke="#BFE0FF" stroke-width="1"/>`;
    svg += '</g>'; x += hw + gap;
  }
  for (let i = 0; i < t; i++) {
    svg += `<g transform="translate(${x} ${pad})"><rect width="${u}" height="${hw}" rx="2" fill="${C.pink}" stroke="${C.ink}" stroke-width="2"/>`;
    for (let k = 1; k < 10; k++) svg += `<line x1="0" y1="${k * u}" x2="${u}" y2="${k * u}" stroke="#FFD0DE" stroke-width="1"/>`;
    svg += '</g>'; x += u + 5;
  }
  if (t) x += gap - 5;
  const oCols = Math.ceil(o / 5);
  for (let i = 0; i < o; i++) { const cx = x + Math.floor(i / 5) * (u + 4), cy = pad + hw - (i % 5 + 1) * (u + 4) + 4; svg += `<rect x="${cx}" y="${cy}" width="${u}" height="${u}" rx="2" fill="${C.butter}" stroke="${C.ink}" stroke-width="2"/>`; }

}

/* 클립으로 재기 */
function clipsSVG(n, label){
  const cw = 34, W = n * cw + 20; let svg = `<rect x="10" y="6" width="${n * cw}" height="22" rx="6" fill="${C.mint}" stroke="${C.ink}" stroke-width="2"/>`;

/* 수를 한글로 읽기 (1~9999) */
const KDIG = ['','일','이','삼','사','오','육','칠','팔','구'];
function numKo(n){
  if (n === 0) return '영';
  const units = [[1000,'천'],[100,'백'],[10,'십'],[1,'']]; let s = '';
  for (const [u, name] of units) { const d = Math.floor(n / u) % 10; if (!d) continue; s += (d === 1 && u > 1 ? '' : KDIG[d]) + name; }
  return s;
}

    if (v === 1) return nq(`c:ma${a}+${b}`, 'missing', '□에 알맞은 수는?', `${a} 더하기 네모는 ${a + b}. 네모는 얼마일까?`, eqH(`${a} + ${QB} = ${a + b}`), b, `${a + b} − ${a}를 계산하면 돼요`, `${a + b} − ${a} = ${b}`);
    if (v === 2) return nq(`c:ms${a + b}-${a}`, 'missing', '□에 알맞은 수는?', `${a + b} 빼기 네모는 ${b}. 네모는 얼마일까?`, eqH(`${a + b} − ${QB} = ${b}`), a, `${a + b} − ${b}를 계산하면 돼요`, `${a + b} − ${b} = ${a}`);
    return nq(`c:mt${a}-${b}`, 'missing', '□에 알맞은 수는?', `네모 빼기 ${a}는 ${b}. 네모는 얼마일까?`, eqH(`${QB} − ${a} = ${b}`), a + b, `${b} + ${a}를 계산하면 돼요`, `${b} + ${a} = ${a + b}`); },

  /* ---------- 4단원 길이 재기 ---------- */
  '4-1'(){ const v = rnd(0, 1);
    if (v === 0) { const n = rnd(3, 8), obj = pick(['연필','크레파스','리본','색연필']); return nq(`c:clip${n}${obj}`, 'clips', `${obj}의 길이는 클립 몇 개만큼일까요?`, null, clipsSVG(n, obj), n, '클립을 하나씩 세어 봐요', `클립 ${n}개만큼`); }

    return ox(`c:oxL${st[0]}`, st[0], st[1], '작은 단위로 재면 여러 번 재야 해요', `${st[0]} → ${st[1]}`); },
  '4-2'(){ const n = rnd(2, 15), v = rnd(0, 1);

  '4-3'(){ const s = Math.random() < .55 ? 0 : rnd(1, 4), len = rnd(2, 9), obj = pick(['연필','지우개','크레파스','머리핀']);
    return nq(`c:ru${s}-${len}`, 'ruler', `${obj}의 길이는 몇 cm일까요?`, `${obj}의 길이는 몇 센티미터일까?`, rulerSVG(s, s + len, { label:obj }), len, s ? `${s}에서 시작했어요. ${s}부터 1 cm가 몇 번 들어가는지 세어 봐요` : '0에 맞추고 끝에 있는 눈금을 읽어요', s ? `${s + len} − ${s} = ${len} cm` : `${len} cm`); },
  '4-4'(){ const items = [['클립',3],['지우개',5],['크레파스',8],['연필',15],['숟가락',20],['공책 긴 쪽',25],['30 cm 자',30]]; const [name, len] = pick(items);

    const far = shuffle(items.filter(x => Math.abs(x[1] - len) >= 7).map(x => x[1])).slice(0, 2);

  /* ---------- 5단원 분류하기 ---------- */
  '5-1'(){ const sets = [
      ['도형을 나누는 기준으로 알맞은 것은?', '모양', ['예쁜 것과 안 예쁜 것', '좋아하는 것과 싫어하는 것']],
      ['과일을 나누는 기준으로 알맞은 것은?', '색깔', ['맛있는 것과 맛없는 것', '좋아하는 순서']],
      ['동물을 나누는 기준으로 알맞은 것은?', '다리의 수', ['귀여운 것과 무서운 것', '좋아하는 동물']],
      ['옷을 나누는 기준으로 알맞은 것은?', '종류 (윗옷, 바지)', ['멋진 옷과 안 멋진 옷', '비싸 보이는 옷']],

      ['단추를 나누는 기준으로 알맞은 것은?', '구멍의 수', ['귀여운 단추', '마음에 드는 단추']],
      ['학용품을 나누는 기준으로 알맞은 것은?', '쓰임 (쓰는 것, 자르는 것)', ['새것 같은 것', '좋아하는 것']],

      return cq(`c:critx${bad[0]}`, 'criterion', '분류 기준이 될 수 없는 것은?', null, null, bad, bad[0], '사람마다 생각이 다를 수 있는 기준을 찾아요', `"${bad[0]}"은 사람마다 달라서 기준이 될 수 없어요`, { cols:1 }); }
    const [p, ans, w] = pick(sets);

function classifyHTML(items){ return `<div class="cls-grid">${items.map(it => `<span>${shapeSVG(it.s, 52, { fill: C[it.c] })}</span>`).join('')}</div>`; }

const ALL_LESSONS = CURRICULUM.units.flatMap((u, ui) => u.lessons.map((l, li) => Object.assign(l, { ui, li, unit:u })));

/* ---------- 진도 상태 ---------- */
function curr(){ if (!S.curr) S.curr = { unit:0, lesson:0, test:false, done:{}, tests:[], medals:[], links:{} }; return S.curr; }
function currentLesson(){ const c = curr(); const u = CURRICULUM.units[c.unit]; return u ? u.lessons[c.lesson] : null; }
function currLabel(){ const c = curr(), u = CURRICULUM.units[c.unit]; if (!u) return '초2 1학기 수학을 모두 끝냈어요!'; return c.test ? `${u.n}단원 ${u.name} · 단원 평가` : `${u.n}단원 ${u.name} · ${c.lesson + 1}차시`; }
function lessonQ(l){ const q = LESSON_GEN[l.id](); q.subj = 'math'; q.lesson = l.id; if (!q.say) q.say = q.prompt; return q; }

/* 오늘 수학 판: 차시 연습 70% + 초1 2학기 복습 30% (+ 전에 틀린 문제) / 단원 평가 날은 평가 12문제 */
function genCurriculumMath(n){
  const c = curr(), u = CURRICULUM.units[c.unit];
  if (!u) return genMathBase(n);
  const used = new Set(), out = [];
  const add = q => { if (!used.has(q.key)) { used.add(q.key); out.push(q); return true; } return false; };
  if (c.test) {
    let g = 0; while (out.length < 12 && g++ < 200) { const l = u.lessons[out.length % u.lessons.length]; const q = lessonQ(l); q.unitTest = true; add(q); }
    return out;
  }
  const l = u.lessons[c.lesson], main = Math.round(n * .7);
  let g = 0; while (out.length < main && g++ < 300) add(lessonQ(l));
  // 앞에서 배운 차시도 조금
  const prev = ALL_LESSONS.filter(x => x.ui < c.unit || (x.ui === c.unit && x.li < c.lesson));
  const sameUnit = prev.filter(x => x.ui === c.unit);
  if (prev.length) { g = 0; while (out.length < main + 2 && g++ < 80) add(lessonQ(pick(sameUnit.length && Math.random() < .7 ? sameUnit : prev))); }
  const review = genMathBase(Math.max(0, n - out.length)).map(q => Object.assign(q, { review11:true }));
  review.forEach(add);
  return out.slice(0, 2).concat(shuffle(out.slice(2)));
}
/* 판이 끝났을 때 진도 판정 */
function judgeCurriculum(b){
  const c = curr(), u = CURRICULUM.units[c.unit]; if (!u || !b.cur) return null;
  const qs = b.cur.items; const right = qs.filter(x => x.first).length, total = qs.length || 1, rate = right / total;
  const t = todayKey();
  if (b.cur.test) {
    const pass = rate >= .8; c.tests.push({ unit:c.unit, rate:Math.round(rate * 100), date:t, pass });
    if (pass) { c.medals.push({ unit:c.unit, date:t }); c.unit++; c.lesson = 0; c.test = false; notify('oppa', `🏅 재윤이가 수학 ${u.n}단원 평가를 통과했어요 (${Math.round(rate * 100)}점)`); notify('mom', `🏅 재윤이가 수학 ${u.n}단원 "${u.name}" 평가를 통과했어요`); }
    return { test:true, pass, rate:Math.round(rate * 100) / 100, unitIdx:CURRICULUM.units.indexOf(u) };
  }
  const l = u.lessons[c.lesson];
  const pass = rate >= .7;
  c.done[l.id] = { date:t, rate:Math.round(rate * 100), tries:((c.done[l.id] || {}).tries || 0) + 1, pass };
  if (pass) { if (c.lesson + 1 < u.lessons.length) c.lesson++; else c.test = true; }
  return { test:false, pass, rate:Math.round(rate * 100) / 100, lessonId:l.id, unitIdx:CURRICULUM.units.indexOf(u) };
}

/* ===================== 가족 연결 (Firebase) =====================
   - 한 가족 = families/{fid}. fid는 20자 이상 무작위 → 링크를 아는 가족만 들어올 수 있다.
   - S의 큰 칸(키)마다 문서 하나: families/{fid}/s/{key} = { v: 값 }
   - 날짜별 공부 기록: families/{fid}/days/{날짜} = { v: 그날 기록 }   (재윤이 기기만 씀)
   - 알림: families/{fid}/notes/{id}                                    (누구나 추가만)
   - 사진·녹음: families/{fid}/blobs/{해시}[_조각]                        (큰 파일은 조각내서)
   - 이 기기에만 남는 것: 역할, 가족 번호, 체험판 날짜, 탭 위치            */
const LOCAL_KEYS = ['local','dayOffset','adultTab','notes','days','v'];
const KID_KEYS = ['started','firstDay','stickers','equipped','seenItems','wrong','avgSec','dictUsed','curr','kidNotes','giftAch'];
const ADULT_KEYS = ['alarms','level','mathMode','dictMode','eyeBreak','tts','bunnyName','pin','praise','voices','grades','gift'];
const BLOB_MIN = 4000, CHUNK = 700000;
function role(){ return (S.local && S.local.role) || 'all'; }
function linked(){ return !!(S.local && S.local.fid); }
function canWriteKid(){ return !linked() || role() === 'kid'; }
function newFid(){ const a = 'abcdefghijkmnpqrstuvwxyz23456789'; let s = ''; const r = new Uint8Array(22); (crypto || window.msCrypto).getRandomValues(r); r.forEach(x => s += a[x % a.length]); return s; }
function hashStr(str){ let h1 = 0xdeadbeef, h2 = 0x41c6ce57; for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909); return (h2 >>> 0).toString(36) + (h1 >>> 0).toString(36) + str.length.toString(36); }

const Sync = {
  db:null, ready:false, status:'off', last:{ s:{}, days:{} }, timer:null, blobCache:{}, blobWait:{}, unsub:[], applying:false,
  base(){ return `families/${S.local.fid}`; },
  async start(){
    if (!linked() || this.ready) return;
    if (!window.firebase || !window.FIREBASE_CONFIG) { this.status = 'nosdk'; return; }
    try {
      this.status = 'connecting';
      if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      await firebase.auth().signInAnonymously();
      this.db = firebase.firestore();
      try { this.blobCache = JSON.parse(localStorage.getItem('jaeyun-blobs') || '{}'); } catch (e) {}
      // 처음 연결할 때 기준점: 지금 이 기기 값
      [...KID_KEYS, ...ADULT_KEYS].forEach(k => this.last.s[k] = JSON.stringify(this.pack(S[k])));
      Object.keys(S.days).forEach(k => this.last.days[k] = JSON.stringify(this.pack(S.days[k])));
      this.listen();
      this.ready = true; this.status = 'on';
    } catch (e) { this.status = 'error'; this.error = String(e && e.message || e); console.warn('sync', e); }
  },
  /* 내 역할이 쓸 수 있는 칸 */
  writable(k){ return true; },   // 실제로 바뀐 칸만 보내므로 누구나 쓸 수 있게 둔다 (같은 칸을 동시에 고치면 나중 것이 남음)
  listen(){
    const b = this.base();
    this.unsub.push(this.db.collection(`${b}/s`).onSnapshot(snap => this.onState(snap)));
    this.unsub.push(this.db.collection(`${b}/days`).onSnapshot(snap => this.onDays(snap)));
    this.unsub.push(this.db.collection(`${b}/notes`).orderBy('at', 'desc').limit(80).onSnapshot(snap => this.onNotes(snap)));
  },
  onState(snap){
    let changed = false;
    snap.docs.forEach(d => { const k = d.id, raw = JSON.stringify(d.data().v);
      if (LOCAL_KEYS.includes(k)) return;
      const dirty = JSON.stringify(this.pack(S[k])) !== this.last.s[k];
      if (raw === this.last.s[k]) return;           // 내가 쓴 것이 돌아온 것
      if (dirty && this.writable(k)) return;         // 아직 못 보낸 내 변경이 우선 (곧 덮어씀)
      this.last.s[k] = raw; S[k] = this.unpack(d.data().v); changed = true; });
    if (changed) this.afterRemote();
  },
  onDays(snap){
    let changed = false;
    snap.docs.forEach(d => { const k = d.id, raw = JSON.stringify(d.data().v);
      if (raw === this.last.days[k]) return;
      const dirty = S.days[k] && JSON.stringify(this.pack(S.days[k])) !== this.last.days[k];
      if (dirty && canWriteKid()) return;
      this.last.days[k] = raw; S.days[k] = this.unpack(d.data().v); changed = true; });
    if (changed) this.afterRemote();
  },
  onNotes(snap){
    const ids = new Set(S.notes.map(n => n.id)); let changed = false;
    snap.docs.forEach(d => { const n = d.data(); if (!ids.has(d.id)) { S.notes.push(Object.assign({ id:d.id }, n)); changed = true; } });
    if (changed) { S.notes.sort((a, b) => b.at - a.at); S.notes = S.notes.slice(0, 80); this.afterRemote(); }
  },
  afterRemote(){
    this.applying = true;
    if (applyGrades()) this.schedule();
    saveLocal();
    this.applying = false;
    refreshIfIdle();
  },
  schedule(){ if (!this.ready) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 700); },
  async push(){
    if (!this.ready) return;
    const b = this.base(), jobs = [];
    for (const k of [...KID_KEYS, ...ADULT_KEYS]) {
      if (!this.writable(k)) continue;
      const v = this.pack(S[k]), raw = JSON.stringify(v);
      if (raw === this.last.s[k] || v === undefined) continue;
      this.last.s[k] = raw; jobs.push(this.db.doc(`${b}/s/${k}`).set({ v, at:Date.now(), by:role() }));
    }
    if (canWriteKid()) for (const k of Object.keys(S.days)) {
      const v = this.pack(S.days[k]), raw = JSON.stringify(v);
      if (raw === this.last.days[k]) continue;
      this.last.days[k] = raw; jobs.push(this.db.doc(`${b}/days/${k}`).set({ v, at:Date.now() }));
    }
    try { await Promise.all(jobs); this.status = 'on'; } catch (e) { this.status = 'error'; this.error = String(e && e.message || e); }
  },
  addNote(n){ if (!this.ready) return; n.id = n.id || ('n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)); this.db.doc(`${this.base()}/notes/${n.id}`).set({ to:n.to, text:n.text, at:n.at, d:n.d }).catch(() => {}); },
  /* 큰 데이터(사진·녹음)를 blobs로 빼고 짧은 표시로 바꾼다 */
  pack(v){
    if (typeof v === 'string') { if (v.startsWith('data:') && v.length > BLOB_MIN) { const h = hashStr(v); this.putBlob(h, v); return 'blobref:' + h; } return v; }
    if (Array.isArray(v)) return v.map(x => this.pack(x));
    if (v && typeof v === 'object') { const o = {}; for (const k in v) { const p = this.pack(v[k]); if (p !== undefined) o[k] = p; } return o; }
    return v;
  },
  unpack(v){
    if (typeof v === 'string' && v.startsWith('blobref:')) { const h = v.slice(8); if (this.blobCache[h]) return this.blobCache[h]; this.fetchBlob(h); return null; }
    if (Array.isArray(v)) return v.map(x => this.unpack(x));
    if (v && typeof v === 'object') { const o = {}; for (const k in v) o[k] = this.unpack(v[k]); return o; }
    return v;
  },
  putBlob(h, data){
    if (this.blobCache[h] || !this.ready) { this.blobCache[h] = data; return; }
    this.blobCache[h] = data; this.saveBlobCache();
    const parts = Math.ceil(data.length / CHUNK), b = this.base();
    for (let i = 0; i < parts; i++) this.db.doc(`${b}/blobs/${h}_${i}`).set({ d:data.slice(i * CHUNK, (i + 1) * CHUNK) }).catch(() => {});
    this.db.doc(`${b}/blobs/${h}`).set({ parts }).catch(() => {});
  },
  async fetchBlob(h){
    if (this.blobWait[h]) return; this.blobWait[h] = true;
    try {
      const meta = await this.db.doc(`${this.base()}/blobs/${h}`).get(); if (!meta.exists) { this.blobWait[h] = false; return; }
      let data = ''; for (let i = 0; i < meta.data().parts; i++) { const p = await this.db.doc(`${this.base()}/blobs/${h}_${i}`).get(); data += p.data().d; }
      this.blobCache[h] = data; this.saveBlobCache();
      // 받은 값을 다시 풀어서 S에 넣는다
      for (const k of [...KID_KEYS, ...ADULT_KEYS]) if (this.last.s[k] && this.last.s[k].includes(h)) S[k] = this.unpack(JSON.parse(this.last.s[k]));
      for (const k of Object.keys(this.last.days)) if (this.last.days[k].includes(h)) S.days[k] = this.unpack(JSON.parse(this.last.days[k]));
      saveLocal(); refreshIfIdle();
    } catch (e) { this.blobWait[h] = false; }
  },
  saveBlobCache(){ try { const keys = Object.keys(this.blobCache); if (keys.length > 30) keys.slice(0, keys.length - 30).forEach(k => delete this.blobCache[k]); localStorage.setItem('jaeyun-blobs', JSON.stringify(this.blobCache)); } catch (e) {} },
  /* 가족방 만들기: 지금 이 기기 기록을 가족 기록으로 올린다 */
  async create(roleName){
    S.local = { fid:newFid(), role:roleName };
    saveLocal(); this.ready = false; await this.start();
    if (!this.ready) return false;
    [...KID_KEYS, ...ADULT_KEYS].forEach(k => this.last.s[k] = '');
    Object.keys(S.days).forEach(k => this.last.days[k] = '');
    const keep = S.local.role; S.local.role = 'all'; await this.push(); S.local.role = keep; saveLocal();
    await this.db.doc(`families/${S.local.fid}`).set({ created:Date.now() });
    return true;
  },
  async join(fid, roleName){
    const old = S.local; S.local = { fid, role:roleName }; saveLocal();
    if (!window.firebase || !window.FIREBASE_CONFIG) { this.status = 'nosdk'; return false; }
    if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    await firebase.auth().signInAnonymously();
    this.db = firebase.firestore();
    const fam = await this.db.doc(`families/${fid}`).get();
    if (!fam.exists) { S.local = old; saveLocal(); return false; }
    // 가족 기록을 받아서 이 기기를 맞춘다
    const st = await this.db.collection(`families/${fid}/s`).get();
    const fresh = freshState(); Object.assign(S, fresh, { local:S.local, notes:[], days:{} });
    st.docs.forEach(d => { S[d.id] = d.data().v; });
    const dy = await this.db.collection(`families/${fid}/days`).get(); dy.docs.forEach(d => { S.days[d.id] = d.data().v; });
    S.started = true;
    [...KID_KEYS, ...ADULT_KEYS].forEach(k => { if (S[k] !== undefined) S[k] = this.unpack(S[k]); });
    Object.keys(S.days).forEach(k => S.days[k] = this.unpack(S.days[k]));
    saveLocal(); this.ready = false; await this.start(); return true;
  },
  leave(){ this.unsub.forEach(f => { try { f(); } catch (e) {} }); this.unsub = []; this.ready = false; S.local = null; this.status = 'off'; saveLocal(); },
};
function familyLink(){ const base = location.href.split('#')[0].split('?')[0]; return `${base}#join=${S.local.fid}`; }
function refreshIfIdle(){
  if (['home','adult','map','gift','cal','room','alldone'].includes(SCREEN)) {
    const y = scrollY; const active = document.activeElement;
    if (active && /INPUT|TEXTAREA|SELECT/.test(active.tagName)) return;

  }
}

      <button class="role-btn" data-a="joinrole" data-v="mom"><span style="font-size:44px">💗</span><b>엄마</b><span class="muted">채점 · 알림 시간</span></button>

};
function familyPanel(){

    <div class="field"><label for="famlink">가족 링크 (카톡으로 보내서 다른 기기에서 열기)</label><input type="text" id="famlink" readonly value="${esc(familyLink())}"></div>

/* ===================== 펜으로 받아쓰기 (태블릿) ===================== */
function penMode(){ const m = S.dictMode || 'auto'; if (m === 'pen') return true; if (m === 'paper') return false; return Math.min(screen.width, screen.height) >= 600; }
let PEN = { drawn:false };
function setupPen(){
  const cv = $('#pen'); if (!cv) return;
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  const x = cv.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.fillStyle = '#fff'; x.fillRect(0, 0, r.width, r.height);
  x.strokeStyle = '#CDEBE0'; x.lineWidth = 2; [r.height * .33, r.height * .66].forEach(y => { x.beginPath(); x.moveTo(0, y); x.lineTo(r.width, y); x.stroke(); });
  x.strokeStyle = '#3A2530'; x.lineWidth = 4.5; x.lineCap = 'round'; x.lineJoin = 'round';
  PEN = { drawn:false, down:false };
  const pt = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  cv.onpointerdown = e => { e.preventDefault(); cv.setPointerCapture && cv.setPointerCapture(e.pointerId); PEN.down = true; const [a, b] = pt(e); x.beginPath(); x.moveTo(a, b); x.lineTo(a + .1, b + .1); x.stroke(); PEN.drawn = true; };
  cv.onpointermove = e => { if (!PEN.down) return; e.preventDefault(); const [a, b] = pt(e); x.lineTo(a, b); x.stroke(); };
  cv.onpointerup = cv.onpointercancel = () => { PEN.down = false; };
}
function penImage(){ const cv = $('#pen'); return cv ? cv.toDataURL('image/jpeg', .6) : null; }
function composePen(dt){
  return new Promise(res => {
    const W = 760, H = 150, cv = document.createElement('canvas'); cv.width = W; cv.height = H * dt.words.length;
    const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height);
    let left = dt.words.length; if (!left) return res(null);
    dt.words.forEach((w, i) => {
      x.fillStyle = '#9B7C8B'; x.font = '22px sans-serif'; x.fillText(`${i + 1}.`, 8, i * H + 40);
      x.strokeStyle = '#EEE'; x.beginPath(); x.moveTo(0, (i + 1) * H - 1); x.lineTo(W, (i + 1) * H - 1); x.stroke();
      const src = (dt.pen || [])[i]; if (!src) { if (--left === 0) res(cv.toDataURL('image/jpeg', .6)); return; }
      const img = new Image(); img.onload = () => { const sc = Math.min((W - 50) / img.width, (H - 8) / img.height); x.drawImage(img, 46, i * H + 4, img.width * sc, img.height * sc); if (--left === 0) res(cv.toDataURL('image/jpeg', .62)); };
      img.onerror = () => { if (--left === 0) res(cv.toDataURL('image/jpeg', .62)); }; img.src = src;
    });
  });
}

  go('home');
})();
