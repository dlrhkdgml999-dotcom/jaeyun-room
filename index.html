<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>재윤이 공부방</title>
<meta name="theme-color" content="#FFF4F7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="재윤이 공부방">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}
/* Layout: one phone-width column, screens swap in place; pastel strawberry-milk world, single light theme by choice */
:root{
  color-scheme: light;
  --bg:#FFF4F7;          /* 딸기우유 */
  --paper:#FFFFFF;
  --ink:#5B3A4A;         /* 따뜻한 자두색 글씨 */
  --ink-soft:#9B7C8B;
  --line:#F6D5E0;
  --pink:#FF8FB1; --pink-deep:#EE5F8D; --pink-pale:#FFE1EA;
  --sky:#8CC9FF;  --sky-deep:#3E93E0;  --sky-pale:#E3F2FF;
  --mint:#7FD8BE; --mint-deep:#2FA884; --mint-pale:#DDF6EE;
  --lav:#C3ADF2;  --lav-deep:#8A67D6;  --lav-pale:#EFE8FF;
  --butter:#FFE08A; --butter-deep:#E7A500; --butter-pale:#FFF5D6;
  --good:#2FA884; --bad:#E5577E;
  --f-display:'Jua','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  --f-body:'Gowun Dodum','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  --r-lg:28px; --r-md:20px; --r-sm:14px;
  --shadow: 0 4px 0 var(--line);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--lav-deep);outline-offset:3px}
input,select{font:inherit;color:var(--ink)}
.app{max-width:480px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column}
.screen{display:flex;flex-direction:column;gap:16px;flex:1}
.disp{font-family:var(--f-display);font-weight:400;letter-spacing:0}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:30px} h2{font-size:24px} h3{font-size:20px}
p{margin:0}
.muted{color:var(--ink-soft)}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}

/* ---------- 공통 버튼 ---------- */
.btn{font-family:var(--f-display);font-size:22px;padding:14px 22px;border-radius:999px;background:var(--pink);color:#fff;box-shadow:0 5px 0 var(--pink-deep);transition:transform .08s, box-shadow .08s;min-height:58px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink-deep)}
.btn.big{font-size:26px;min-height:68px;width:100%}
.btn.mint{background:var(--mint-deep);box-shadow:0 5px 0 #1F7E62}
.btn.sky{background:var(--sky-deep);box-shadow:0 5px 0 #2A6FB0}
.btn.lav{background:var(--lav-deep);box-shadow:0 5px 0 #6646AE}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.small{font-size:17px;min-height:44px;padding:8px 16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:48px;height:48px;border-radius:50%;background:var(--paper);border:2px solid var(--line);display:grid;place-items:center;box-shadow:0 3px 0 var(--line);flex:none}
.icon-btn svg{width:24px;height:24px}
.speak-btn{width:60px;height:60px;border-radius:50%;background:var(--butter);box-shadow:0 4px 0 var(--butter-deep);display:grid;place-items:center;flex:none}
.speak-btn svg{width:30px;height:30px}
.speak-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--butter-deep)}

/* ---------- 토끼 ---------- */
.bunny{display:block;overflow:visible}
.bunny .ear-l{transform-origin:72px 100px;animation:earL 4s ease-in-out infinite}
.bunny .ear-r{transform-origin:128px 100px;animation:earR 4s ease-in-out infinite}
@keyframes earL{0%,85%,100%{transform:rotate(0)}90%{transform:rotate(-8deg)}}
@keyframes earR{0%,80%,100%{transform:rotate(0)}86%{transform:rotate(9deg)}}
.hop{animation:hop .6s ease-in-out 2}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px) scale(1.03)}}
.wiggle{animation:wig .5s ease-in-out}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.stage{position:relative;border-radius:var(--r-lg);display:grid;place-items:center;overflow:hidden}
.bg-none{background:radial-gradient(circle at 50% 120%, var(--pink-pale) 0 55%, transparent 56%)}
.bg-sky{background:radial-gradient(circle at 20% 30%, #fff 0 18px, transparent 19px),radial-gradient(circle at 30% 26%, #fff 0 24px, transparent 25px),radial-gradient(circle at 78% 22%, #fff 0 16px, transparent 17px),radial-gradient(circle at 86% 26%, #fff 0 22px, transparent 23px),linear-gradient(#BFE3FF,#E9F5FF)}
.bg-berry{background:radial-gradient(circle, #FF9DB8 0 5px, transparent 6px) 0 0/34px 34px, radial-gradient(circle, #fff 0 3px, transparent 4px) 17px 17px/34px 34px, #FFD3E0}
.bg-night{background:radial-gradient(circle, #FFF6C8 0 2px, transparent 3px) 0 0/40px 40px, radial-gradient(circle, #fff 0 1.5px, transparent 2.5px) 20px 14px/52px 52px, linear-gradient(#3D3A7A,#6B5BB0)}
.bg-sea{background:radial-gradient(circle, rgba(255,255,255,.7) 0 6px, transparent 7px) 10px 0/60px 70px, radial-gradient(circle, rgba(255,255,255,.5) 0 3px, transparent 4px) 40px 30px/60px 70px, linear-gradient(#7FD3F0,#3E93E0)}
.bg-candy{background:repeating-linear-gradient(45deg, #FFE1EA 0 18px, #FFF5D6 18px 36px, #DDF6EE 36px 54px, #EFE8FF 54px 72px)}

/* ---------- 말풍선 ---------- */
.bubble{position:relative;background:var(--paper);border:2.5px solid var(--line);border-radius:22px;padding:12px 16px;font-family:var(--f-display);font-size:21px;line-height:1.35}
.bubble.left::after{content:"";position:absolute;left:-12px;top:22px;border:10px solid transparent;border-right-color:var(--line);border-left:0}

/* ---------- 홈 ---------- */
.home-top{display:flex;align-items:center;gap:10px}
.date-chip{font-family:var(--f-display);font-size:17px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:6px 14px}
.sticker-chip{font-family:var(--f-display);font-size:18px;background:var(--butter-pale);border:2px solid var(--butter);border-radius:999px;padding:6px 14px;display:flex;align-items:center;gap:6px}
.hero{display:grid;grid-template-columns:132px 1fr;gap:6px;align-items:center}
.hero .stage{height:150px}
.alarm-banner{background:var(--butter-pale);border:2.5px dashed var(--butter-deep);border-radius:var(--r-md);padding:12px 16px;font-family:var(--f-display);font-size:19px;display:flex;align-items:center;gap:10px}
.boards{display:grid;gap:12px}
.board-card{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-radius:var(--r-md);background:var(--paper);border:2.5px solid var(--line);box-shadow:var(--shadow);text-align:left;width:100%}
.board-card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.board-card .badge{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-family:var(--f-display);font-size:24px;color:#fff}
.board-card .t{font-family:var(--f-display);font-size:22px;line-height:1.2}
.board-card .s{font-size:15px;color:var(--ink-soft)}
.board-card .state{font-family:var(--f-display);font-size:16px;padding:6px 12px;border-radius:999px;background:var(--pink-pale);color:var(--pink-deep);white-space:nowrap}
.board-card.next{border-color:var(--pink);box-shadow:0 4px 0 var(--pink)}
.board-card.next .state{background:var(--pink);color:#fff}
.board-card.done{background:#FFFBFC}
.board-card.done .state{background:var(--mint-pale);color:var(--mint-deep)}
.board-card.doing .state{background:var(--butter-pale);color:var(--butter-deep)}
.k-kor{background:var(--pink)} .k-math{background:var(--sky-deep)} .k-eng{background:var(--mint-deep)} .k-rev{background:var(--lav-deep)}
.home-nav{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nav-tile{background:var(--paper);border:2.5px solid var(--line);border-radius:var(--r-md);padding:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:20px}
.nav-tile .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:24px}
.nav-tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.grown-up{align-self:center;font-size:15px;color:var(--ink-soft);padding:10px 16px;display:flex;align-items:center;gap:6px}
.grown-up svg{width:18px;height:18px}
.next-item{background:var(--paper);border:2.5px solid var(--line);border-radius:var(--r-md);padding:12px 16px;display:grid;gap:8px}
.meter{height:14px;border-radius:999px;background:var(--pink-pale);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--pink-deep))}

/* ---------- 공부판 ---------- */
.q-top{display:flex;align-items:center;gap:12px}
.track{flex:1;position:relative;height:40px}
.track .rail{position:absolute;left:0;right:0;top:16px;height:10px;border-radius:999px;background:var(--paper);border:2px solid var(--line)}
.track .fill{position:absolute;left:0;top:16px;height:10px;border-radius:999px;background:var(--pink);transition:width .4s}
.track .runner{position:absolute;top:-6px;width:40px;height:44px;transform:translateX(-50%);transition:left .4s}
.track .goal{position:absolute;right:-6px;top:6px;font-size:24px}
.q-card{background:var(--paper);border:2.5px solid var(--line);border-radius:var(--r-lg);padding:20px 18px;display:grid;gap:16px;box-shadow:var(--shadow)}
.q-head{display:flex;align-items:center;gap:12px}
.q-prompt{font-family:var(--f-display);font-size:24px;line-height:1.3;flex:1}
.q-visual{display:grid;place-items:center;min-height:120px;text-align:center}
.pic{font-size:96px;line-height:1.1}
.sent{font-family:var(--f-display);font-size:27px;line-height:1.5}
.sent .blank{display:inline-block;min-width:3.4em;border-bottom:4px dashed var(--pink);margin:0 4px}
.options{display:grid;gap:12px}
.options.cols3{grid-template-columns:repeat(3,1fr)}
.options.cols2{grid-template-columns:1fr 1fr}
.opt{background:var(--paper);border:3px solid var(--line);border-radius:var(--r-md);min-height:72px;padding:10px 12px;font-family:var(--f-display);font-size:28px;box-shadow:0 4px 0 var(--line);display:flex;align-items:center;justify-content:center;gap:8px;line-height:1.25}
.opt.text-long{font-size:23px}
.opt.four{font-size:22px;padding:8px 4px;white-space:nowrap}
.opt.pic-opt{font-size:64px;min-height:104px}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.right{border-color:var(--good);background:var(--mint-pale);box-shadow:0 4px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:#FFF0F4;animation:wig .4s}
.opt.dim{opacity:.4}
.opt .say{width:40px;height:40px;border-radius:50%;background:var(--butter);display:grid;place-items:center;flex:none}
.opt .say svg{width:20px;height:20px}
.swatch{width:58px;height:58px;border-radius:50%;border:3px solid var(--line)}
.feedback{display:flex;align-items:center;gap:10px;min-height:56px}
.feedback .bubble{flex:1;font-size:19px}
.hint-box{background:var(--butter-pale);border:2.5px dashed var(--butter-deep);border-radius:var(--r-md);padding:12px 14px;display:grid;gap:10px;justify-items:center;text-align:center;font-family:var(--f-display);font-size:19px}

/* 펜 받아쓰기 */
.pen-wrap{display:grid;gap:10px;justify-items:center;width:100%}
.pen-canvas{width:100%;height:190px;border:3px solid var(--mint);border-radius:var(--r-md);background:#fff;touch-action:none;cursor:crosshair}

/* 눈 건강 */
.eye-overlay{align-items:start}
/* 강의 보러 가기 버튼은 창이 길어도 항상 화면 아래에 보이게 */
.eye-card .lec-go{position:sticky;bottom:0;z-index:2;box-shadow:0 5px 0 var(--pink-deep),0 -14px 18px 6px var(--paper)}
.eye-card{background:var(--paper);border-radius:var(--r-lg);padding:22px 20px;max-width:440px;width:100%;display:grid;gap:14px;justify-items:center;text-align:center}
.eye-list{list-style:none;padding:0;margin:0;display:grid;gap:6px;text-align:left;font-size:17px}
.eye-tip{background:var(--mint-pale);color:#1F7E62;border-radius:999px;padding:8px 16px;font-family:var(--f-display);font-size:17px}
.eye-timer{position:relative;display:grid;place-items:center}
.eye-timer span{position:absolute;font-size:52px;color:var(--mint-deep)}

/* 가족 연결 */
.role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-self:stretch}
.role-btn{background:var(--paper);border:3px solid var(--line);border-radius:var(--r-md);padding:14px 8px;display:grid;gap:4px;justify-items:center;box-shadow:var(--shadow);font-family:var(--f-display);font-size:20px}
.role-btn .muted{font-family:var(--f-body);font-size:13px}
.adult-peek{background:var(--lav-pale);color:#5E4A8E;border-radius:var(--r-sm);padding:10px 14px;font-size:15px;text-align:left;width:100%}

/* 수학 진도 */
.lesson-card{display:grid;gap:8px;justify-items:center;text-align:center;background:var(--paper);border:2.5px solid var(--line);border-radius:var(--r-md);padding:14px 16px;align-self:stretch}
.lesson-card.won{border-color:var(--butter-deep);background:linear-gradient(135deg,var(--butter-pale),var(--pink-pale))}
.eyebrow{font-family:var(--f-display);font-size:15px;color:var(--sky-deep);letter-spacing:.02em}
.concept{background:var(--paper);border:2.5px solid var(--line);border-radius:var(--r-lg);padding:18px;display:grid;gap:16px;box-shadow:var(--shadow)}
.concept-ill{display:grid;place-items:center;min-height:180px;gap:10px}
.concept-ill svg.draw{width:min(100%,560px)!important;height:auto}
.concept-ill .row svg.draw{width:auto!important}
a.btn{text-decoration:none}
.concept-text{display:flex;gap:12px;align-items:center}
.concept-text p{flex:1;font-family:var(--f-display);font-size:22px;line-height:1.5;word-break:keep-all}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)} .dots i.on{background:var(--pink);width:28px;border-radius:999px}
.unit-card{background:var(--paper);border:2.5px solid var(--line);border-radius:var(--r-md);padding:14px 16px;display:grid;gap:10px}
.unit-card.now{border-color:var(--pink);box-shadow:0 4px 0 var(--pink)} .unit-card.next{opacity:.65}
.unit-no{width:36px;height:36px;border-radius:12px;background:var(--sky-deep);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:20px}
.lesson-dots{display:flex;flex-wrap:wrap;gap:8px}
.ldot{min-width:44px;height:44px;border-radius:999px;border:2.5px solid var(--line);background:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:17px;padding:0 10px;color:var(--ink-soft)}
.ldot.ok{background:var(--mint-pale);border-color:var(--mint-deep);color:var(--mint-deep)} .ldot.cur{background:var(--pink);border-color:var(--pink-deep);color:#fff;animation:pulse 1.4s infinite}
.ldot.test{border-style:dashed} .ldot[disabled]{opacity:.6}
.map-tile{display:flex;align-items:center;gap:12px;background:var(--paper);border:2.5px solid var(--sky);border-radius:var(--r-md);padding:12px 16px;box-shadow:0 4px 0 var(--sky);width:100%}
.mini-dots{display:flex;gap:5px} .mini-dots i{width:12px;height:12px;border-radius:50%;background:var(--line)} .mini-dots i.ok{background:var(--mint-deep)} .mini-dots i.cur{background:var(--pink)} .mini-dots i.t{border-radius:3px}
.vis-html{display:grid;place-items:center;gap:10px;width:100%}
.cls-grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:360px}
table.pv{border-collapse:collapse;font-family:var(--f-display);font-size:24px;text-align:center}
table.pv th{font-size:15px;color:var(--ink-soft);padding:6px 12px;font-weight:400}
table.pv td{padding:6px 14px;border:2px solid var(--line);min-width:44px}
table.pv td.carry{border:0;font-size:16px;color:var(--pink-deep)} table.pv tr.sum td{border-top:3px solid var(--ink)}
.qbox-inline{display:inline-grid;place-items:center;width:1.3em;height:1.3em;border:3px dashed var(--pink);border-radius:50%;color:var(--pink-deep)}

/* 난이도 설정 */
.lvl-row{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center}
.lvl-row select{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-family:var(--f-display);font-size:18px;min-width:0;width:100%}
.lvl-tip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:var(--r-sm);padding:10px 12px;font-size:15px}
.lvl-tip.up{background:var(--mint-pale)} .lvl-tip.down{background:var(--butter-pale)}

/* 학년별 문제 */
.text-q{font-size:27px;line-height:1.55;text-align:center;word-break:keep-all}
.big-word{font-family:var(--f-display);font-size:44px;color:var(--ink)}
.groups{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:340px}
.grp-box{border:3px dashed var(--sky);border-radius:16px;padding:4px 8px;font-size:26px;letter-spacing:2px;background:var(--sky-pale)}
.frac{display:inline-grid;grid-template-rows:auto auto;justify-items:center;line-height:1.05;vertical-align:middle;font-family:var(--f-display)}
.frac>span:first-child{border-bottom:3px solid currentColor;padding:0 6px}
.eq .frac{font-size:.85em}

/* 숫자판 */
.answer-box{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-display);font-size:24px}
.answer-box .slot{min-width:110px;height:72px;border-radius:var(--r-md);border:3px solid var(--sky);background:var(--sky-pale);display:grid;place-items:center;font-size:44px;color:var(--sky-deep)}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.numpad button{min-height:62px;border-radius:var(--r-md);background:var(--paper);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);font-family:var(--f-display);font-size:30px}
.numpad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.numpad .ok{background:var(--sky-deep);color:#fff;border-color:var(--sky-deep);box-shadow:0 4px 0 #2A6FB0;font-size:24px}
.numpad .del{font-size:20px}

/* 글자 블록 */
.slots{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;min-height:76px}
.slots .s{width:68px;height:72px;border-radius:var(--r-sm);border:3px dashed var(--pink);display:grid;place-items:center;font-family:var(--f-display);font-size:38px;background:var(--pink-pale)}
.slots .s.filled{border-style:solid;background:var(--paper)}
.tiles{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.tiles button{width:72px;height:72px;border-radius:var(--r-sm);background:var(--butter-pale);border:3px solid var(--butter);box-shadow:0 4px 0 var(--butter-deep);font-family:var(--f-display);font-size:36px}
.tiles button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--butter-deep)}
.tiles button.used{visibility:hidden}

/* 수학 그림 */
.dots{display:flex;flex-direction:column;gap:6px;align-items:center}
.frame{display:grid;grid-template-columns:repeat(5,30px);gap:4px;padding:6px;border:2.5px solid var(--line);border-radius:12px;background:#fff}
.frame i{width:30px;height:30px;border-radius:50%;background:#F4EEF1;display:block;position:relative}
.frame i.a{background:var(--pink)} .frame i.b{background:var(--mint)}
.frame i.x::after{content:"";position:absolute;left:4px;right:4px;top:13px;height:4px;background:var(--ink);border-radius:2px;transform:rotate(-40deg)}
.frames{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.count-grid{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;max-width:320px;font-size:38px;line-height:1}
.count-grid .grp{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tens{display:flex;gap:10px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.ten-bar{display:grid;grid-template-rows:repeat(10,12px);gap:2px;padding:4px;border:2.5px solid var(--sky-deep);border-radius:8px;background:var(--sky-pale)}
.ten-bar i{width:16px;height:12px;border-radius:3px;background:var(--sky-deep);display:block}
.one-dot{width:22px;height:22px;border-radius:50%;background:var(--pink);display:block}
.ones{display:grid;grid-template-columns:repeat(3,22px);gap:4px}
.eq{font-family:var(--f-display);font-size:46px;letter-spacing:.02em}
.eq .q{display:inline-block;min-width:1.4em;border-bottom:5px dashed var(--sky);color:var(--sky-deep)}
.split{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:6px 30px;justify-items:center;font-family:var(--f-display);font-size:40px;position:relative}
.split .top{grid-column:1/3;width:84px;height:84px;border-radius:50%;background:var(--sky-pale);border:3px solid var(--sky-deep);display:grid;place-items:center}
.split .leaf{width:72px;height:72px;border-radius:50%;background:var(--paper);border:3px solid var(--line);display:grid;place-items:center}
.split .leaf.q{border:3px dashed var(--sky-deep);color:var(--sky-deep)}
.pattern{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:44px;align-items:center}
.pattern .qbox{width:58px;height:58px;border:3px dashed var(--pink);border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-size:34px;color:var(--pink-deep)}
.clock{width:190px;height:190px}

/* ---------- 받아쓰기 ---------- */
.dict-num{font-family:var(--f-display);font-size:84px;line-height:1;color:var(--mint-deep)}
.note-paper{background:repeating-linear-gradient(#fff 0 38px, #CDEBE0 38px 40px);border:2.5px solid var(--mint);border-radius:var(--r-md);padding:18px;display:grid;justify-items:center;gap:10px}
.photo-prev{width:100%;border-radius:var(--r-md);border:2.5px solid var(--line)}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* ---------- 보상 ---------- */
.reward{align-items:center;text-align:center;justify-content:center}
.big-sticker{width:170px;height:170px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:96px;box-shadow:0 0 0 8px #fff, 0 0 0 11px var(--pink), 0 14px 24px rgba(238,95,141,.25);animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(-6deg)}}
.score-line{font-family:var(--f-display);font-size:22px}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}

/* ---------- 스티커북 / 꾸미기 ---------- */
.tabs{display:flex;gap:8px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:5px}
.tabs button{flex:1;border-radius:999px;padding:10px 6px;font-family:var(--f-display);font-size:18px;min-height:46px}
.tabs button.on{background:var(--pink);color:#fff}
.sticker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.stk{aspect-ratio:1;max-width:100%;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:36px;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--line),0 4px 8px rgba(91,58,74,.08)}
.stk.empty{background:transparent;box-shadow:none;border:3px dashed var(--line);font-size:16px;color:var(--ink-soft)}
.dress-stage{height:260px}
.item-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{background:var(--paper);border:3px solid var(--line);border-radius:var(--r-md);padding:8px 6px;display:grid;justify-items:center;gap:4px;font-family:var(--f-display);font-size:15px;box-shadow:0 3px 0 var(--line);min-height:116px;text-align:center;line-height:1.2}
.item .thumb{width:60px;height:60px;display:grid;place-items:center}
.item .thumb svg{width:60px;height:60px}
.item.on{border-color:var(--pink);background:var(--pink-pale)}
.item.locked{opacity:.55}
.item .lock{font-size:13px;color:var(--ink-soft);font-family:var(--f-body)}
.bg-thumb{width:56px;height:56px;border-radius:14px;border:2px solid var(--line)}

/* ---------- 달력 ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .dow{font-family:var(--f-display);font-size:15px;color:var(--ink-soft)}
.cal .d{aspect-ratio:1;border-radius:14px;background:var(--paper);border:2px solid var(--line);display:grid;place-items:center;position:relative;font-family:var(--f-display);font-size:15px}
.cal .d.blank{background:transparent;border:0}
.cal .d.today{border-color:var(--pink);border-width:3px}
.cal .d .stamp{position:absolute;inset:3px;display:grid;place-items:center}
.cal .d .stamp svg{width:88%;height:88%}
.cal .d.half .stamp{opacity:.4}
.legend{display:flex;gap:16px;justify-content:center;font-size:15px;color:var(--ink-soft)}

/* ---------- 어른 화면 ---------- */
.adult{gap:14px}
.adult .panel{background:var(--paper);border:2px solid var(--line);border-radius:var(--r-md);padding:16px;display:grid;gap:12px}
.adult h3{font-size:19px}
.adult .tabs button{font-size:17px}
.demo-note{font-size:14px;background:var(--lav-pale);border-radius:var(--r-sm);padding:10px 12px;color:#5E4A8E;line-height:1.45}
.pin-dots{display:flex;gap:14px;justify-content:center}
.pin-dots i{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink-soft)}
.pin-dots i.on{background:var(--ink);border-color:var(--ink)}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--bg);border-radius:var(--r-sm);padding:10px 6px;text-align:center;display:grid;gap:2px}
.stat b{font-family:var(--f-display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-soft)}
.list{display:grid;gap:8px}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);background:var(--bg);font-size:16px;min-width:0}
.li .grow{flex:1;min-width:0}
.pill{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--pink-pale);color:var(--pink-deep);white-space:nowrap;font-family:var(--f-display)}
.pill.ok{background:var(--mint-pale);color:var(--mint-deep)}
.pill.wait{background:var(--butter-pale);color:#A06F00}
.pill.no{background:#F2ECEF;color:var(--ink-soft)}
.ox{display:flex;gap:6px}
.ox button{width:48px;height:44px;border-radius:12px;border:2px solid var(--line);background:#fff;font-family:var(--f-display);font-size:20px}
.ox button.o.on{background:var(--mint-deep);border-color:var(--mint-deep);color:#fff}
.ox button.x.on{background:var(--bad);border-color:var(--bad);color:#fff}
.alarm-row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}
.alarm-row .dn{font-family:var(--f-display);font-size:18px;text-align:center}
.alarm-row input[type=time]{border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;min-width:0;width:100%}
.switch{width:56px;height:32px;border-radius:999px;background:#E8DCE1;position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.switch.on{background:var(--mint-deep)}
.switch.on::after{transform:translateX(24px)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px}
.bars .bcol{display:grid;gap:4px;justify-items:center;align-content:end;height:100%}
.bars .bar{width:100%;max-width:30px;border-radius:8px 8px 4px 4px;background:var(--pink);min-height:3px}
.bars .bar.zero{background:var(--line)}
.bars small{font-size:12px;color:var(--ink-soft)}
.bars .v{font-size:12px;font-variant-numeric:tabular-nums}
.subj-acc{display:grid;gap:8px}
.subj-acc .r{display:grid;grid-template-columns:72px 1fr 44px;gap:10px;align-items:center;font-size:15px}
.subj-acc .m{height:12px;border-radius:999px;background:var(--bg);overflow:hidden}
.subj-acc .m i{display:block;height:100%;border-radius:999px}
.field{display:grid;gap:6px}
.field input[type=text],.field input[type=password],.field textarea{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font:inherit;width:100%;color:var(--ink)}
.rec-btn{width:84px;height:84px;border-radius:50%;background:var(--bad);color:#fff;font-family:var(--f-display);font-size:17px;box-shadow:0 5px 0 #B23A5C;display:grid;place-items:center}
.rec-btn.on{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 5px 0 #B23A5C,0 0 0 12px rgba(229,87,126,.2)}}
audio{width:100%}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;font-size:15px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 8px 20px rgba(0,0,0,.18)}
.overlay{position:fixed;inset:0;background:rgba(91,58,74,.55);display:grid;place-items:center;z-index:40;padding:20px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
/* 화면보다 긴 창: 위에서부터 보이고 위아래로 밀 수 있게 (짧으면 가운데) */
.overlay{align-items:start}.overlay > *{margin-block:auto}
.overlay img{max-width:100%;max-height:90vh;border-radius:12px;background:#fff}

/* ---------- 이름표 · 선물 ---------- */
.nameplate{font-family:var(--f-display);font-size:24px;color:var(--pink-deep);background:var(--paper);border:2.5px solid var(--pink);border-radius:999px;padding:4px 16px 4px 14px;box-shadow:0 3px 0 var(--pink);position:relative}
.nameplate::before{content:"🎀";margin-right:4px}
.stage-btn{display:block;width:100%;border-radius:var(--r-lg)}
.stage-btn:active{transform:scale(.97)}
.gift-card{display:flex;align-items:center;gap:12px;background:var(--paper);border:2.5px dashed var(--pink);border-radius:var(--r-md);padding:12px 16px;text-align:left;width:100%}
.gift-card.won{border-style:solid;background:linear-gradient(135deg,var(--pink-pale),var(--butter-pale));box-shadow:0 4px 0 var(--pink)}
.gpath{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.gstep{aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--paper);border:2.5px dashed var(--line);display:grid;place-items:center;position:relative;font-family:var(--f-display);color:var(--ink-soft);font-size:15px}
.gstep b{font-weight:400}
.gstep.on{border:2.5px solid var(--pink);background:var(--pink-pale)}
.gstep svg{width:70%;height:70%}
.gstep small{position:absolute;bottom:-3px;font-size:10px;font-family:var(--f-body);color:var(--ink);background:var(--paper);border-radius:6px;padding:0 3px}
.gstep.gift{border:3px solid var(--butter-deep);background:var(--butter-pale)}
.gstep.gift svg{width:84%;height:84%}

/* ---------- 설치 안내 ---------- */
.install-tile{background:var(--sky-pale);border:2.5px solid var(--sky);border-radius:var(--r-md);padding:12px 16px;display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-size:19px;box-shadow:0 4px 0 var(--sky);text-align:left;width:100%}
.install-tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sky)}
.step{display:grid;grid-template-columns:128px 1fr;gap:14px;align-items:center;background:var(--paper);border:2.5px solid var(--line);border-radius:var(--r-md);padding:12px}
.step .txt{display:grid;gap:8px;min-width:0}
.step .num{width:34px;height:34px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:19px}
.step .say-line{font-family:var(--f-display);font-size:21px;line-height:1.35}
.step.kid .say-line{font-size:24px}
.phone{width:128px;height:220px;border:4px solid var(--ink);border-radius:20px;background:#fff;position:relative;overflow:hidden;font-size:10px;line-height:1.2}
.phone .bar{position:absolute;left:0;right:0;top:0;height:28px;background:#F3EEF1;display:flex;align-items:center;gap:4px;padding:0 6px}
.phone .addr{flex:1;height:14px;border-radius:7px;background:#fff;border:1px solid #E2D6DC}
.phone .dots{width:14px;display:grid;gap:2px;justify-items:center}
.phone .dots i{width:3px;height:3px;border-radius:50%;background:var(--ink);display:block}
.phone .bbar{position:absolute;left:0;right:0;bottom:0;height:26px;background:#F3EEF1;display:flex;align-items:center;justify-content:space-around;padding:0 6px}
.phone .bbar i{width:10px;height:3px;background:#B9A9B1;border-radius:2px;display:block}
.phone .ham{display:grid;gap:2px}.phone .ham i{width:12px;height:2.5px;background:var(--ink)}
.phone .pagec{position:absolute;left:8px;right:8px;top:36px;display:grid;gap:5px}
.phone .pagec span{height:10px;border-radius:5px;background:var(--pink-pale);display:block}
.phone .menu{position:absolute;right:4px;top:30px;width:92px;background:#fff;border:1.5px solid #D9CCD2;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.12);padding:3px;display:grid;gap:2px}
.phone .menu.bottom{top:auto;bottom:30px;left:4px;right:4px;width:auto}
.phone .menu b{font-weight:400;padding:4px 5px;border-radius:5px;font-size:9.5px}
.phone .dialog{position:absolute;left:8px;right:8px;top:70px;background:#fff;border:1.5px solid #D9CCD2;border-radius:10px;box-shadow:0 6px 14px rgba(0,0,0,.15);padding:8px;display:grid;gap:6px;justify-items:center;text-align:center}
.phone .dialog .btns{display:flex;gap:6px}
.phone .dialog .btns b{font-weight:400;padding:3px 8px;border-radius:6px}
.phone .hi{background:var(--butter);outline:2.5px solid var(--pink-deep);animation:blink 1.2s ease-in-out infinite}
.phone .ring{position:absolute;width:26px;height:26px;border-radius:50%;border:3px solid var(--pink-deep);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{box-shadow:0 0 0 5px rgba(238,95,141,.25)}}
.phone .homegrid{position:absolute;inset:14px 10px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px 6px;align-content:start;justify-items:center}
.phone .homegrid i{width:28px;height:28px;border-radius:9px;background:#E8DFE4;display:block}
.phone .homegrid .app-ic{width:34px;height:34px;border-radius:10px;background:var(--pink-pale);display:grid;place-items:center;outline:2.5px solid var(--pink-deep)}
.phone .homegrid small{font-size:8px;grid-column:span 1;text-align:center}
.done-note{background:var(--mint-pale);border-radius:var(--r-md);padding:14px 16px;font-family:var(--f-display);font-size:19px;color:#1F7E62}

/* ---------- 태블릿 ---------- */
@media (min-width: 700px){
  body{font-size:19px}
  .app{max-width:880px;padding-block:24px 44px}
  .boards{grid-template-columns:1fr 1fr}
  .hero{grid-template-columns:210px 1fr} .hero .stage{height:210px!important} .hero .bunny{width:160px;height:192px}
  .bubble{font-size:24px}
  .board-card{grid-template-columns:72px 1fr;grid-template-rows:auto auto} .board-card .state{grid-column:2;justify-self:start}
  .board-card .badge{width:72px;height:72px;font-size:26px} .board-card .t{font-size:24px}
  .q-card{padding:28px 30px;gap:20px} .q-prompt{font-size:28px}
  .opt{min-height:90px;font-size:32px} .opt.pic-opt{min-height:120px;font-size:72px} .opt.text-long{font-size:26px} .opt.four{font-size:26px}
  .numpad{max-width:520px;justify-self:center;width:100%} .numpad button{min-height:78px;font-size:34px}
  .answer-box .slot{min-width:150px;height:86px;font-size:50px}
  .pic{font-size:120px} .eq{font-size:56px} .text-q{font-size:32px}
  .concept-ill{min-height:260px} .concept-text p{font-size:27px}
  .item-grid{grid-template-columns:repeat(6,1fr)}
  .sticker-grid{grid-template-columns:repeat(auto-fill,minmax(86px,1fr))} .stk{font-size:46px}
  .cal .d{font-size:18px}
  .tiles button{width:84px;height:84px;font-size:42px} .slots .s{width:80px;height:84px;font-size:44px}
  .pen-canvas{height:240px}
  .gpath{grid-template-columns:repeat(10,1fr)}
}
@media (min-width: 960px) and (orientation: landscape){
  .app{max-width:1120px}
  .q-card{grid-template-columns:1.1fr 1fr;column-gap:32px;align-items:center}
  .q-card > .q-head{grid-column:1 / -1}
  .q-card > .q-visual{grid-row:span 3;min-height:300px}
  .concept{grid-template-columns:1.2fr 1fr;align-items:center}
  .boards{grid-template-columns:repeat(4,1fr)} .board-card{grid-template-columns:1fr;justify-items:start}
  .board-card .state{grid-column:1}
}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}

/* 진도 3과목 · EBS 강의 */
.seg{display:flex;gap:8px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:5px}
.seg button{flex:1;border-radius:999px;padding:10px 6px;font-family:var(--f-display);font-size:19px;min-height:48px}
.seg button.on{background:var(--sky-deep);color:#fff}
.map-row{display:flex;align-items:center;gap:8px;font-size:15px}
.map-row b{font-family:var(--f-display);font-weight:400;font-size:16px;min-width:2.4em}
.map-row .muted{min-width:5.6em}
.lec-box{display:flex;align-items:center;gap:12px;background:var(--sky-pale);border:2.5px solid var(--sky);border-radius:var(--r-md);padding:10px 14px;align-self:stretch}
.lec-no{flex:none;min-width:64px;height:64px;border-radius:18px;background:var(--sky-deep);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:24px;padding:0 6px}
.passage{background:#FFFBEF;border:2px dashed var(--butter);border-radius:var(--r-md);padding:14px 16px;font-family:var(--f-display);font-size:21px;line-height:1.7;text-align:left;word-break:keep-all;width:100%}
.letter{font-family:'Helvetica Neue',Arial,system-ui,sans-serif;font-weight:700;color:var(--ink);line-height:1}
.letter-chip{display:inline-flex;align-items:baseline;gap:4px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 10px;font-family:'Helvetica Neue',Arial,sans-serif;font-size:22px}
.letter-chip b{font-size:30px;color:var(--sky-deep)}
.word-chip{display:grid;justify-items:center;gap:2px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-family:'Helvetica Neue',Arial,sans-serif;font-size:18px}
.field select{width:100%;min-width:0;max-width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font:inherit;color:var(--ink)}
.adult .panel, .adult .panel *{min-width:0}
.adult .panel .li .grow{overflow-wrap:anywhere}
@media (min-width:700px){ .passage{font-size:24px} }

/* 캡슐 · 도감 · 순서 고르기 */
.home-nav{grid-template-columns:repeat(3,1fr)}
.home-nav .nav-tile{flex-direction:column;justify-content:center;gap:4px;padding:10px 6px;font-size:18px}
.capsule{background:none;border:0;padding:0;filter:drop-shadow(0 8px 0 rgba(238,95,141,.18))}
.capsule.shake{animation:capshake .45s}
@keyframes capshake{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-7deg)}80%{transform:rotate(5deg)}}
.cap-dots{display:flex;gap:10px;justify-content:center}
.cap-dots i{width:16px;height:16px;border-radius:50%;background:var(--line)} .cap-dots i.on{background:var(--pink-deep)}
.cap-item{font-size:120px;line-height:1;width:190px;height:190px;border-radius:50%;display:grid;place-items:center;background:#fff;border:5px solid var(--line);animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.cap-item.r2{border-color:var(--sky);box-shadow:0 0 0 8px var(--sky-pale)}
.cap-item.r3{border-color:transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#FF8FB1,#FFE08A,#7FD8BE,#8CC9FF,#C3ADF2) border-box;box-shadow:0 0 30px rgba(195,173,242,.7)}
.rare-tag{display:inline-block;font-family:var(--f-display);font-size:16px;padding:4px 14px;border-radius:999px;background:var(--line);color:var(--ink)}
.rare-tag.r2{background:var(--sky-pale);color:var(--sky-deep)}
.rare-tag.r3{background:linear-gradient(90deg,#FFD1E0,#FFF1BF,#CFF3E6,#D6ECFF,#E7DDFB)}
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.book-cell{background:#fff;border:2.5px solid var(--line);border-radius:var(--r-md);padding:10px 4px;display:grid;justify-items:center;gap:4px;position:relative;box-shadow:var(--shadow)}
.book-cell .e{font-size:44px;line-height:1.1} .book-cell .n{font-family:var(--f-display);font-size:13px;text-align:center;word-break:keep-all}
.book-cell .cnt{position:absolute;top:4px;right:8px;font-size:12px;color:var(--ink-soft)}
.book-cell.r2{border-color:var(--sky)} .book-cell.r3{border-color:var(--lav-deep)}
.book-cell.on{outline:4px solid var(--pink);outline-offset:2px}
.book-cell.on::after{content:"♥";position:absolute;top:2px;left:8px;color:var(--pink-deep)}
.book-cell.empty{opacity:.45;box-shadow:none;border-style:dashed}
.stage-btn{position:relative}
.friends{position:absolute;left:0;right:0;bottom:2px;display:flex;justify-content:space-around;font-size:26px;pointer-events:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.08))}
.order-pick{background:var(--butter-pale);border:2.5px dashed var(--butter-deep);border-radius:var(--r-md);padding:12px 14px;display:grid;gap:10px;justify-items:center}
.order-btn{flex:1;background:#fff;border:2.5px solid var(--line);border-radius:var(--r-md);padding:8px 4px;display:grid;justify-items:center;gap:4px;font-family:var(--f-display);font-size:18px;box-shadow:var(--shadow)}
.order-btn .badge{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:17px}
/* 1학년 2학기: 수 카드 · 수 배열표 · 코스 제목 */
.num-card{display:inline-grid;place-items:center;width:58px;height:74px;border:3px solid var(--ink,#5B3A4A);border-radius:12px;background:#fff;font-family:Jua,sans-serif;font-size:38px;box-shadow:0 3px 0 rgba(91,58,74,.18)}
.hchart td{min-width:46px;height:44px;font-size:22px}
.course-head{font-size:19px;font-weight:400;margin:10px 2px 0;color:var(--ink,#5B3A4A);opacity:.85}
.opt .clock{width:100%;height:auto}

/* ---------- 토리랑 놀기 (tori.js) ---------- */
.tori-stage{position:relative;overflow:hidden;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:pan-y;cursor:pointer;border:0;padding:0;font:inherit;color:inherit;width:100%}
.dress-stage.tori-stage{display:grid;place-items:center}
.bunny .mouth-talk{opacity:0}
.bunny.talking .mouth{opacity:0}
.bunny.talking .mouth-talk{opacity:1;transform-box:fill-box;transform-origin:center;animation:toriTalk .17s ease-in-out infinite alternate}
@keyframes toriTalk{from{transform:scaleY(.3) scaleX(1.1)}to{transform:scaleY(1) scaleX(.95)}}
.bunny.e-normal .eyes,.bunny.e-wow .eyes,.bunny.e-think .eyes{transform-box:fill-box;transform-origin:center;animation:toriBlink 5.2s infinite}
@keyframes toriBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.bunny{transform-origin:50% 92%}
.t-spin{animation:toriSpin 1s ease-in-out}
@keyframes toriSpin{0%{transform:rotate(0)}70%{transform:rotate(380deg)}85%{transform:rotate(350deg)}100%{transform:rotate(360deg)}}
.t-flap .ear-l{animation:toriFlapL .3s ease-in-out 3!important}
.t-flap .ear-r{animation:toriFlapR .3s ease-in-out 3!important}
@keyframes toriFlapL{50%{transform:rotate(-22deg)}}
@keyframes toriFlapR{50%{transform:rotate(22deg)}}
.t-dance{animation:toriDance 1.2s ease-in-out}
@keyframes toriDance{0%,100%{transform:rotate(0) translateY(0)}15%{transform:rotate(-12deg) translateY(-8px)}30%{transform:rotate(0) translateY(0)}45%{transform:rotate(12deg) translateY(-8px)}60%{transform:rotate(0) translateY(0)}80%{transform:translateY(-16px) scale(1.04)}}
.t-bigjump{animation:toriJump .9s cubic-bezier(.3,.7,.4,1)}
@keyframes toriJump{0%{transform:scale(1,1)}15%{transform:scale(1.1,.85)}45%{transform:translateY(-40px) scale(.95,1.08)}75%{transform:translateY(0) scale(1.08,.9)}100%{transform:scale(1,1)}}
.t-shy{animation:toriShy .7s ease-in-out}
@keyframes toriShy{0%,100%{transform:scale(1)}30%{transform:scale(1.06,.92)}60%{transform:scale(.97,1.04)}}
.t-nod{animation:toriNod .7s ease-in-out}
@keyframes toriNod{0%,100%{transform:rotate(0)}30%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}}
.t-purr{animation:toriPurr .5s ease-in-out infinite}
.t-purr .cheeks{animation:toriBlush .5s ease-in-out infinite alternate}
@keyframes toriPurr{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(2deg) scale(1.03,.98)}}
@keyframes toriBlush{to{opacity:.55}}
.tori-fx{position:absolute;pointer-events:none;font-size:24px;line-height:1;transform:translate(-50%,-50%);animation:toriFx 1.3s ease-out forwards;z-index:3}
@keyframes toriFx{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),-260%) scale(.9)}}
.tori-say{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:88%;background:var(--paper,#fff);border:2.5px solid var(--line);border-radius:18px;padding:8px 12px;font-family:var(--f-display);font-size:18px;line-height:1.3;white-space:pre-line;z-index:4;pointer-events:none}
#heroBubble{white-space:pre-line}
.t-pop{animation:toriPop .35s cubic-bezier(.3,1.6,.5,1)}
.tori-say.t-pop{animation:toriPopC .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes toriPop{from{transform:scale(.85);opacity:.4}to{transform:scale(1);opacity:1}}
@keyframes toriPopC{from{transform:translateX(-50%) scale(.85);opacity:.4}to{transform:translateX(-50%) scale(1);opacity:1}}
.board-card.t-call{animation:toriCall .5s ease-in-out 3}
@keyframes toriCall{50%{transform:scale(1.04);box-shadow:0 0 0 6px rgba(238,95,141,.3)}}
@media (prefers-reduced-motion: reduce){.bunny.e-normal .eyes{animation:none}}
/* 동기화 알림 (엄마·오빠 메뉴 맨 위) */
.sync-alert{border-radius:var(--r-md);padding:12px 14px;font-size:16px;line-height:1.5;border:2.5px solid}
.sync-alert.warn{background:#FFF1E6;border-color:#F2A65A;color:#7A3E0F}
.sync-alert.soft{background:var(--butter-pale);border-color:var(--butter-deep)}
.sync-alert.ok{background:var(--mint-pale);border-color:transparent;color:#1F7E62;font-size:15px;padding:8px 14px}

/* ---------- 받아쓰기 채점: 글씨 옆 O · X ---------- */
.grade-card{display:grid;gap:10px;background:var(--bg);border-radius:var(--r-md);padding:12px;margin-top:10px}
.grade-rows,.grade-list{display:grid;gap:8px}
.grade-row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:#fff;border:2.5px solid var(--line);border-radius:14px;padding:8px 10px;transition:border-color .15s,background .15s}
.grade-row.is-o{border-color:var(--mint-deep);background:#F2FBF7}
.grade-row.is-x{border-color:var(--bad);background:#FFF3F3}
.grade-row .gn{font-family:var(--f-display);font-size:20px;color:var(--ink-soft);text-align:center}
.grade-row .gw{display:grid;gap:4px;min-width:0}
.grade-row .crop{display:block;width:100%;aspect-ratio:760/150;background-image:var(--img);background-repeat:no-repeat;border-radius:8px;border:1px solid #EEE;background-color:#fff}
.grade-row .gans{font-size:15px;color:var(--ink-soft)} .grade-row .gans b{color:var(--ink);font-size:17px}
.grade-row .gw > b{font-size:18px}
.grade-row .ox button{width:58px;height:54px;font-size:24px}
@media (max-width:560px){
  .grade-row{grid-template-columns:18px 1fr auto;gap:8px;padding:6px 8px}
  .grade-row .gn{font-size:16px}
  .grade-row .ox{gap:5px} .grade-row .ox button{width:46px;height:46px;font-size:20px}
  .grade-row .gans{font-size:13px} .grade-row .gans b{font-size:15px}
}
.grade-split{display:grid;gap:10px}
.grade-photo img{width:100%;border-radius:12px;cursor:zoom-in;display:block}
@media (min-width:700px){ .grade-split{grid-template-columns:1.2fr 1fr;align-items:start} .grade-photo{position:sticky;top:10px} }
@media (max-width:699px){ .grade-photo{position:sticky;top:0;z-index:2;background:var(--bg);padding-bottom:6px} .grade-photo img{max-height:38vh;object-fit:contain} }
.grade-foot .btn[disabled]{opacity:.45}
.dict-result{display:flex;flex-wrap:wrap;gap:6px}
.dict-result span{background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 10px;font-size:15px}
.dict-result span.ok{border-color:#BFE8D6} .dict-result span.no{border-color:#F5B5B5;background:#FFF3F3}

/* ---------- 공부 기록 ---------- */
.study-tile{border-color:var(--pink);background:var(--pink-pale)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:15px;font-family:var(--f-display);min-height:40px}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.chip.on.warn{background:var(--bad);border-color:var(--bad)}
.sticky-chips{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.date-row{flex-wrap:wrap;gap:8px;margin:10px 0}
.date-row input{flex:1;min-width:0;width:0;font:inherit;font-size:16px;padding:8px 10px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.stat b small{font-size:14px;color:var(--ink-soft)}
.subj-acc.s4 .r{grid-template-columns:44px 1fr 44px 64px} .subj-acc.s4 .r.head{font-size:13px}
.scal-m{margin-top:8px} .scal-m h4{margin:6px 0;font-family:var(--f-display);font-weight:400;font-size:18px}
.scal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.scal .dow{text-align:center;font-size:13px;color:var(--ink-soft);padding:2px 0}
.sd{position:relative;aspect-ratio:1/.92;border-radius:10px;display:grid;place-items:center;align-content:center;border:2px solid transparent;font:inherit;color:var(--ink);padding:0;min-width:0}
.sd .n{position:absolute;top:2px;left:5px;font-size:11px;color:var(--ink-soft)}
.sd b{font-family:var(--f-display);font-weight:400;font-size:clamp(15px,4.2vw,22px);line-height:1;font-variant-numeric:tabular-nums}
.sd i{font-style:normal;font-size:10px;color:var(--ink-soft)}
.sd .ck{position:absolute;top:1px;right:4px;font-size:12px;color:#1F7E62;font-weight:700}
.sd.blank{visibility:hidden}
.sd.out{background:transparent;opacity:.35} .sd.out.fut{opacity:.2}
.sd.h0{background:#F7F2F4} .sd.h1{background:#E3F4EC} .sd.h2{background:#B9E5D0} .sd.h3{background:#7FCCA9} .sd.h4{background:#3FAF80;color:#fff}
.sd.h4 .n,.sd.h4 i,.sd.h4 .ck{color:#fff}
.sd.part{border:2px dashed #8CCFB0}
.sd.today{border-color:var(--butter-deep)}
.sd.sel{border-color:var(--pink-deep);box-shadow:0 0 0 3px rgba(238,95,141,.25)}
button.sd:active{transform:scale(.95)}
.heat-legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:12px;color:var(--ink-soft);margin-top:10px}
.heat-legend .sw{width:16px;height:16px;border-radius:5px;display:inline-block}
.heat-legend .sw.h0{background:#F7F2F4} .heat-legend .sw.h1{background:#E3F4EC} .heat-legend .sw.h2{background:#B9E5D0} .heat-legend .sw.h3{background:#7FCCA9} .heat-legend .sw.h4{background:#3FAF80}
.sboard{border-top:2px dashed var(--line);padding-top:10px;margin-top:10px;display:grid;gap:4px}
.lqs{display:grid;gap:6px;margin-top:6px}
.lq{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start;background:#fff;border:2px solid #EFE6EA;border-radius:12px;padding:8px 10px}
.lq.re{border-color:#F3DFA8} .lq.no{border-color:#F5B5B5;background:#FFF8F8}
.lr{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px}
.lr.ok{background:#E3F4EC;color:#1F7E62} .lr.re{background:var(--butter-pale);color:#9A6B00} .lr.no{background:#FDE2E2;color:#C0392B}
.lt{display:grid;gap:3px;font-size:15px;line-height:1.4;min-width:0;overflow-wrap:anywhere}
.lsub{font-size:12px;font-weight:700}
.la{font-size:14px;color:var(--ink-soft)} .la b{color:var(--ink)} .la s{color:#C0392B}
.ls{margin-left:8px;font-size:12px;opacity:.7}

.sbadge{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:14px;flex:none}
.lq.ok{border:0;background:transparent;padding:2px 4px;grid-template-columns:22px 1fr;gap:6px}
.lq.ok .lr{width:20px;height:20px;font-size:12px} .lq.ok .lt{font-size:14px;color:var(--ink-soft)} .lq.ok .la b{color:var(--ink)}
.heat-legend .lg-ck{margin-left:6px;color:#1F7E62;font-weight:700} .heat-legend .lg-part{border:2px dashed #8CCFB0;border-radius:6px;padding:0 6px}
.sticky-chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sticky-chips::-webkit-scrollbar{display:none}
.sticky-chips .chip{flex:none}
#dayDetail{scroll-margin-top:64px}
.sd .ck{top:auto;bottom:1px;right:4px}
@media (min-width:900px){
  .grade-rows{grid-template-columns:1fr 1fr}
  .grade-row .crop{max-height:96px}
  .scal{max-width:620px;margin:0 auto}
  .heat-legend{justify-content:center}
}
/* 과목별 맞은 · 틀린 문제 */
.ptabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ptab{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 2px;display:grid;gap:3px;justify-items:center;font:inherit;color:var(--ink);min-width:0}
.ptab b{font-family:var(--f-display);font-weight:400;font-size:17px;white-space:nowrap}
.ptab span{font-size:12px;display:flex;flex-wrap:wrap;justify-content:center;gap:2px 6px} .ptab i{font-style:normal;white-space:nowrap}
.ptab.on{border-color:var(--pink-deep);background:var(--pink-pale);box-shadow:0 0 0 2px rgba(238,95,141,.2)}
@media (max-width:420px){ .ptab b{font-size:15px} .ptab span{font-size:11px} }
.pdate{font-family:var(--f-display);font-size:15px;color:var(--ink-soft);margin:8px 2px 0}
.lq.okb{border-color:#CDEBDD;background:#F7FCF9}
.lq .lr{font-size:14px}
.ptag{display:inline-block;font-size:11px;background:var(--lav-deep);color:#fff;border-radius:6px;padding:0 5px;margin-right:5px;vertical-align:1px}
.subj-acc .r.tap{cursor:pointer;border-radius:8px} .subj-acc .r.tap:active{background:var(--bg)}
.sticky-chips{position:static;padding:4px 0 0}
#dayDetail{scroll-margin-top:8px}
/* EBS 강의 찾기 */
.lec-today{display:flex;align-items:center;gap:14px;background:var(--sky-pale);border:3px solid var(--sky-deep);border-radius:var(--r-md);padding:10px 14px;align-self:stretch}
.lec-big{flex:none;min-width:84px;height:84px;border-radius:22px;background:var(--sky-deep);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:46px;line-height:1;padding:0 8px}
.lec-big small{font-size:20px;display:block;margin-top:-6px}
.ebs-list{align-self:stretch;border:2px solid #E5E5E5;border-radius:14px;overflow:hidden;background:#fff;text-align:left}
.ebs-head{background:#F4F4F4;font-size:13px;color:#666;padding:6px 12px}
.ebs-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid #EEE;opacity:.5;font:inherit;color:var(--ink);background:#fff;text-align:left;width:100%}
.ebs-row .ebs-no{font-family:var(--f-display);font-size:18px;min-width:44px}
.ebs-row .ebs-t{font-size:15px;display:grid;line-height:1.3} .ebs-row .ebs-t small{font-size:12px;color:#888}
.ebs-row .ebs-play{width:30px;height:30px;border-radius:50%;background:#FF8A3D;color:#fff;display:grid;place-items:center;font-size:12px}
.ebs-row.me{opacity:1;background:#FFF1E6;outline:3px solid #FF8A3D;outline-offset:-3px}
.ebs-row.me .ebs-no{font-size:22px;color:#D35400}
.ebs-pick{background:#FF8A3D;color:#fff;border-radius:999px;padding:4px 10px;font-family:var(--f-display);font-size:16px;white-space:nowrap;animation:pulse 1.4s ease-in-out infinite}
.lec-pick{display:grid;gap:10px;align-self:stretch;max-width:520px;margin:0 auto;width:100%}
.ebs-row.big{opacity:1;border:3px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.ebs-row.big .ebs-no{font-size:28px;min-width:64px;color:var(--sky-deep)}
.ebs-row.big .ebs-t{font-size:17px}
.ebs-row.big.other{border-style:dashed} .ebs-row.big.other .ebs-no{color:var(--ink-soft)}
.ebs-row.big:active{transform:scale(.98)}

/* 오늘 한눈에 (엄마·오빠 메뉴 맨 위) */
.glance{display:grid;gap:10px;width:100%;text-align:left;border-radius:var(--r-md);padding:14px 16px;border:2.5px solid var(--line);background:var(--paper,#fff);color:inherit;font:inherit;cursor:pointer}
.glance.ok{background:var(--mint-pale);border-color:var(--mint-deep)}
.glance.doing{background:var(--sky-pale,#EAF5FF);border-color:var(--sky-deep)}
.glance.late{background:#FFF1E6;border-color:#F2A65A}
.gl-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.gl-head b{font-family:var(--f-display);font-weight:400;font-size:21px;flex:1;min-width:0}
.gl-head .muted{font-size:14px}
.gl-chips{display:flex;gap:6px;flex-wrap:wrap}
.gl-chip{font-size:14px;padding:3px 10px;border-radius:999px;background:var(--bg);color:var(--ink-soft)}
.gl-chip.done{background:var(--mint-deep);color:#fff}
.gl-chip.doing{background:var(--butter-pale);color:#7A5A00;border:1.5px dashed var(--butter-deep)}
.gl-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gl-stats span{background:rgba(255,255,255,.7);border-radius:var(--r-sm);padding:8px 4px;text-align:center;display:grid;gap:2px;font-size:13px;color:var(--ink-soft)}
.gl-stats b{font-family:var(--f-display);font-weight:400;font-size:21px;color:var(--ink);font-variant-numeric:tabular-nums}
.gl-stats b.bad{color:var(--pink-deep,#D94A7A)}
.gl-line{font-size:14px;line-height:1.45;color:var(--ink-soft);overflow-wrap:anywhere}
.gl-more{font-size:14px;color:var(--pink-deep,#D94A7A);justify-self:end}
/* 폰 알림 권하기 (엄마·오빠 메뉴 맨 위) */
.push-nudge{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--butter-pale);border:2.5px solid var(--butter-deep);border-radius:var(--r-md);padding:12px 14px;font-size:15px;line-height:1.45}
.push-nudge > span:nth-child(2){min-width:180px}

/* ntfy 알림 연결 3단계 */
.ntfy-steps{display:grid;gap:8px;margin:6px 0;padding-left:22px;font-size:15px;line-height:1.45}
.ntfy-steps li{display:list-item}
.ntfy-steps li > span{display:block;margin-bottom:4px}
.ntfy-who{border-top:2px dashed var(--line);padding:8px 0;display:grid;gap:6px}
.ntfy-who summary{cursor:pointer;font-size:17px;padding:4px 0}

</style>

;\n  return { code: code, json: json };\n}\n/* Firestore 값 → 보통 값 */\nfunction val_(v) {\n  if (!v) return null;\n  if ('stringValue' in v) return v.stringValue;\n  if ('integerValue' in v) return Number(v.integerValue);\n  if ('doubleValue' in v) return v.doubleValue;\n  if ('booleanValue' in v) return v.booleanValue;\n  if ('nullValue' in v) return null;\n  if ('arrayValue' in v) return (v.arrayValue.values || []).map(val_);\n  if ('mapValue' in v) { const o = {}, f = v.mapValue.fields || {}; for (const k in f) o[k] = val_(f[k]); return o; }\n  return null;\n}\nfunction doc_(path) { const r = fs_(path); if (r.code === 404) return null; const o = {}, f = r.json.fields || {}; for (const k in f) o[k] = val_(f[k]); return o; }\n\n/* ---------- 폰 알림 보내기 ---------- */\nfunction pushTo_(roles, body, tag) {\n  const list = (fs_('families/' + FID + '/push?pageSize=50').json.documents || [])\n    .map(function (d) { return { name: d.name, token: val_((d.fields || {}).token), roles: val_((d.fields || {}).roles) || [] }; })\n    .filter(function (d) { return d.token && d.roles.some(function (r) { return roles.indexOf(r) >= 0; }); });\n  let ok = 0;\n  list.forEach(function (d) {\n    const r = UrlFetchApp.fetch('https://fcm.googleapis.com/v1/projects/' + PROJECT + '/messages:send', {\n      method: 'post', contentType: 'application/json', headers: auth_(), muteHttpExceptions: true,\n      payload: JSON.stringify({ message: { token: d.token, data: { title: '재윤이 공부방', body: body, tag: tag || '', url: APP_URL },\n        webpush: { headers: { Urgency: 'high', TTL: '21600' } } } }) });\n    const code = r.getResponseCode();\n    if (code === 200) ok++;\n    else if (code === 404 || /UNREGISTERED|INVALID_ARGUMENT/.test(r.getContentText())) {   // 앱을 지웠거나 알림을 끈 폰 → 목록에서 지움\n      UrlFetchApp.fetch('https://firestore.googleapis.com/v1/' + d.name, { method: 'delete', headers: auth_(), muteHttpExceptions: true });\n    } else console.warn('FCM ' + code + ' ' + r.getContentText().slice(0, 300));\n  });\n  return ok;\n}\n\n/* ---------- 10분마다: 알림 시간 지났는데 시작 안 함 ---------- */\nfunction checkLate() {\n  const now = new Date(), key = Utilities.formatDate(now, 'Asia/Seoul', 'yyyy-MM-dd');\n  const dow = Number(Utilities.formatDate(now, 'Asia/Seoul', 'u')) % 7;   // 0 = 일요일\n  const mins = Number(Utilities.formatDate(now, 'Asia/Seoul', 'H')) * 60 + Number(Utilities.formatDate(now, 'Asia/Seoul', 'm'));\n  const props = PropertiesService.getScriptProperties();\n  if (props.getProperty('late') === key) return;\n  const a = doc_('families/' + FID + '/s/alarms'), al = a && a.v;\n  if (!al || al.nudge === false || !al.on || !al.on[dow]) return;\n  const t = String((al.time || [])[dow] || '16:00').split(':'), hh = Number(t[0]), mm = Number(t[1]);\n  const late = mins - (hh * 60 + mm);\n  if (late < 30 || late > 180) return;\n  const day = doc_('families/' + FID + '/days/' + key), v = day && day.v;\n  if (v && v.boards && Object.keys(v.boards).length) return;   // 이미 시작함\n  props.setProperty('late', key);\n  pushTo_(['mom'], '⏰ ' + t[0] + ':' + t[1] + ' 공부 알림 뒤 ' + late + '분이 지났는데 재윤이가 아직 시작하지 않았어요. (태블릿이 인터넷에 연결돼 있는지도 확인해 주세요)', 'late');\n}\n\n/* ---------- 처음 한 번 실행 ---------- */\nfunction setup() {\n  ScriptApp.getProjectTriggers().forEach(function (t) { if (t.getHandlerFunction() === 'checkLate') ScriptApp.deleteTrigger(t); });\n  ScriptApp.newTrigger('checkLate').timeBased().everyMinutes(10).create();\n  const fam = doc_('families/' + FID);\n  if (!fam) throw new Error('가족방을 못 찾았어요. 앱 설정 탭의 코드를 다시 복사해 주세요');\n  const phones = (fs_('families/' + FID + '/push?pageSize=50').json.documents || []).length;\n  console.log('준비 끝! 알림 받는 폰 ' + phones + '대' + (phones ? '' : ' (폰에서 \"알림 켜기\"를 누르면 생겨요)'));\n}\n";

/* ---------- 작은 도구들 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const DOW = ['일','월','화','수','목','금','토'];
function hasBatchim(word){ const c = word.charCodeAt(word.length - 1) - 0xAC00; return c >= 0 && c <= 11171 && c % 28 !== 0; }
function josa(word, a, b){ return word + (hasBatchim(word) ? a : b); }
function numRo(n){ return [true,false,false,true,false,false,true,false,false,false][n % 10] ? '으로' : '로'; }
function numJosa(n, a, b){ const d = n % 10; const has = [true,true,false,true,false,false,true,true,true,false][d]; return n + (has ? a : b); }

/* ---------- 저장 ---------- */
const STORE_KEY = 'jaeyun-room-v1';
let MEM = null;
function freshState(){
  return {
    v:1, started:false, bunnyName:'토리', pin:'0000', dayOffset:0,
    days:{}, stickers:[], equipped:{head:null,face:null,neck:null,bg:null}, seenItems:[],
    wrong:[], avgSec:{kor:50,math:50,eng:32,rev:45}, dictUsed:{},
    praise:null, voices:{}, notes:[], kidNotes:[],
    alarms:{on:[true,true,true,true,true,true,true], time:['10:00','16:00','16:00','16:00','16:00','16:00','10:00'], nudge:true},
    adultTab:'mom', local:null,
    level:{ kor:1, math:1, eng:0 }, mathMode:'curr', curr:null, currs:{}, modes:{ kor:'curr', eng:'curr' }, ebsOn:{ math:true, kor:true }, ebsLinks:{}, lastLec:null,
    tts:{ preset:'tori', voice:'', pitch:1.35, rate:.86, enVoice:'' },
    gift:{ name:'', goal:30, round:1, start:null, achieved:null, history:[] }, giftAch:{}, grades:{},
  };
}
function loadState(){
  let s = null;
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) s = JSON.parse(raw); } catch (e) {}
  if (!s) s = MEM;
  const base = freshState();
  if (!s) return base;
  return Object.assign(base, s, { alarms: Object.assign(base.alarms, s.alarms || {}), avgSec: Object.assign(base.avgSec, s.avgSec || {}), gift: Object.assign(base.gift, s.gift || {}), tts: Object.assign(base.tts, s.tts || {}), level: Object.assign(base.level, s.level || {}) });
}
let S = loadState();
let saveWarned = false;
function prunePhotos(){
  // 받아쓰기 사진은 최근 7일 것만 이 폰에 남긴다
  const cut = addDays(todayKey(), -7);
  Object.entries(S.days).forEach(([k, d]) => { if (k < cut && d.dict && d.dict.photo) d.dict.photo = null; });
  // 문제별 기록은 180일까지만 남긴다 (점수·시간은 계속 남음)
  const cut2 = addDays(todayKey(), -180);
  Object.entries(S.days).forEach(([k, d]) => { if (k < cut2 && d.boards) Object.values(d.boards).forEach(b => { if (b && b.log) delete b.log; }); });
}
function save(){ saveLocal(); if (!Sync.applying) Sync.schedule(); }
function saveLocal(){
  MEM = S;
  prunePhotos();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
  catch (e) {
    // 저장 공간이 부족하면 오래된 받아쓰기 사진부터 지운다
    const keys = Object.keys(S.days).sort();
    for (const k of keys) { const d = S.days[k]; if (d.dict && d.dict.photo && gradeOf(k).graded) { d.dict.photo = null; try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); return; } catch (e2) {} } }
    if (!saveWarned) { saveWarned = true; toast('이 폰의 저장 공간이 부족해요. 녹음 파일 크기를 줄여 주세요.'); }
  }
}

/* ---------- 날짜 ---------- */
function now(){ const d = new Date(); d.setDate(d.getDate() + (S.dayOffset || 0)); return d; }
function keyOf(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function todayKey(){ return keyOf(now()); }
function addDays(k, n){ const [y,m,d] = k.split('-').map(Number); const t = new Date(y, m - 1, d); t.setDate(t.getDate() + n); return keyOf(t); }
function korDate(d){ return `${d.getMonth() + 1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`; }
function shortDate(k){ const [, m, d] = k.split('-').map(Number); return `${m}/${d}`; }
function day(k = todayKey()){
  if (!S.days[k]) S.days[k] = { boards:{}, dict:null, earned:[], bonus:false, done:false, m2:false };
  return S.days[k];
}

let AC = null;
function tone(seq){
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t0 = AC.currentTime;
    seq.forEach(([f, st, dur, type = 'triangle', vol = .16]) => {

function dueWrong(subj){ const t = todayKey(); return S.wrong.filter(w => w.subj !== 'dict' && w.due <= t && w.served !== t && (!subj || w.subj === subj)); }
/* 많이 틀린 것, 오래 기다린 것부터 */
function takeDue(list, n){
  const t = todayKey();
  const picked = list.sort((a, b) => (b.misses - a.misses) || a.due.localeCompare(b.due)).slice(0, n);
  picked.forEach(w => w.served = t);
  return picked.map(w => Object.assign(JSON.parse(JSON.stringify(w.q)), { rev:w.id }));
}
function genReview(n){
  const due = takeDue(dueWrong(), n);
  const out = [...due];
  const fill = n - out.length;
  if (fill > 0) {
    const extra = [...genKor(Math.ceil(fill / 3)), ...genMath(Math.ceil(fill / 3)), ...genEng(Math.ceil(fill / 3))];
    shuffle(extra).slice(0, fill).forEach(q => { if (!out.some(o => o.key === q.key)) out.push(q); });
  }
  return shuffle(out);
}
/* soft: 힌트 보고 두 번째에 맞힌 문제 — 한 번만 더 맞히면 목록에서 빠진다 */
function addWrong(q, soft){
  const t = todayKey();
  const id = q.rev || q.key;
  const w = S.wrong.find(x => x.id === id);
  if (w) { w.streak = 0; w.due = addDays(t, 1); w.misses = (w.misses || 1) + (soft ? 0 : 1); w.last = t; }
  else { const clean = JSON.parse(JSON.stringify(q)); delete clean.rev; S.wrong.push({ id, subj:q.subj, q:clean, due:addDays(t, soft ? 2 : 1), streak:soft ? 1 : 0, misses:soft ? 0 : 1, added:t, last:t }); }
}
function reviewRight(q){
  const w = S.wrong.find(x => x.id === q.rev); if (!w) return;
  w.streak++; if (w.streak >= 2) S.wrong = S.wrong.filter(x => x !== w); else w.due = addDays(todayKey(), 3);
}

/* ---------- 받아쓰기 ---------- */
function pickDict(n){
  const t = todayKey();
  const again = S.wrong.filter(w => w.subj === 'dict' && w.due <= t).map(w => w.q.w);
  const rest = shuffle(dictBank().filter(w => !again.includes(w))).sort((a, b) => (S.dictUsed[a] || '').localeCompare(S.dictUsed[b] || ''));
  const words = [...again, ...rest].slice(0, n);
  words.forEach(w => S.dictUsed[w] = t);
  return words;
}

  if (q.input === 'numpad') { $('#slot').textContent = RUN.typed; return; }
  if (q.input === 'build') { const slots = card.querySelector('.slots'), tiles = card.querySelector('.tiles'); const tmp = document.createElement('div'); tmp.innerHTML = inputHTML(q); slots.replaceWith(tmp.children[0]); tiles.replaceWith(tmp.children[0]); }
}
function feedback(html, expr){ $('#fb').innerHTML = `${bunnySVG({ size:56, expr, cls: expr === 'happy' ? 'hop' : 'wiggle' })}<div class="bubble left">${html}</div>`; }
function answer(val){
  if (RUN.locked) return;
  ++SEQ;
  const q = RUN.q, b = RUN.b, k = RUN.k;
  const right = String(val) === String(q.ans);
  if (right) {
    RUN.locked = true; SFX.right();
    markOpt(q.ans, 'right');
    if (RUN.tries === 0) { b.correct++; if (q.rev) reviewRight(q); }
    else addWrong(q, true);
    if (b.cur && (q.lesson || q.unitTest) && !q.review11 && !q.rev) b.cur.items.push({ key:q.key, first:RUN.tries === 0 });
    logQ(b, q, RUN.tries === 0 ? 1 : 2);
    feedback(esc(pick(PRAISE_LINES)) + (q.eng ? ` <b>${esc(q.explain)}</b>` : ''), 'happy');
    if (q.eng) speak(q.ans, 'en-US');
    setTimeout(() => nextQ(), q.eng ? 1500 : 1100);
    return;
  }
  RUN.tries++; (RUN.wrongs = RUN.wrongs || []).push(String(val));
  SFX.wrong();
  if (q.input === 'choice') markOpt(val, 'wrong');
  if (RUN.tries === 1) {
    if (q.input === 'numpad') { RUN.typed = ''; rerenderInput(); }
    if (q.input === 'build') { RUN.built = []; rerenderInput(); }
    $('#fb').innerHTML = `${bunnySVG({ size:56, expr:'think', cls:'wiggle' })}<div class="hint-box" style="flex:1">${q.hintHTML || ''}<span>${esc(pick(TRY_LINES))}<br>${esc(q.hint)}</span></div>`;
    speak(q.hint);
  } else {
    RUN.locked = true;
    addWrong(q);
    if (b.cur && (q.lesson || q.unitTest) && !q.review11 && !q.rev) b.cur.items.push({ key:q.key, first:false });
    logQ(b, q, 0);
    if (q.input === 'choice') markOpt(q.ans, 'right');
    if (q.input === 'numpad') { RUN.typed = String(q.ans); rerenderInput(); }
    if (q.input === 'build') { RUN.built = [...q.ans].map(ch => q.tiles.indexOf(ch)); rerenderInput(); }
    $('#fb').innerHTML = `${bunnySVG({ size:56, expr:'normal' })}<div class="hint-box" style="flex:1"><span>괜찮아! 정답은 <b>${esc(q.ans)}</b>.<br>${esc(q.explain || '')}<br>내일 복습에서 다시 만나자!</span><button class="btn small" data-a="nextq">다음 문제</button></div>`;
    speak(`정답은 ${q.eng ? '' : q.ans}. ${q.eng ? '' : '내일 다시 만나자!'}`).then(() => { if (q.eng) speak(q.ans, 'en-US'); });
  }

}
function markOpt(val, cls){

function compressImage(file, max = 1000){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const sc = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .62)); };
      img.onerror = rej; img.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

let RECORDING = null, REC = null, CHUNKS = [];
async function startRec(target){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    CHUNKS = []; REC = new MediaRecorder(stream);
    REC.ondataavailable = e => CHUNKS.push(e.data);
    REC.onstop = () => { stream.getTracks().forEach(t => t.stop()); const blob = new Blob(CHUNKS, { type:REC.mimeType || 'audio/webm' }); blobToData(blob).then(data => { setAudio(target, data); }); };
    REC.start(); RECORDING = target; go('adult');
  } catch (e) {
    toast('이 화면에서는 바로 녹음이 안 돼요. "파일 올리기"로 녹음 파일을 올려 주세요.');
  }
}
function stopRec(){ try { REC && REC.stop(); } catch (e) {} RECORDING = null; }
function blobToData(blob){ return new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(blob); }); }
function setAudio(target, data){
  if (target === 'praise') { S.praise = Object.assign(S.praise || {}, { audio:data, at:Date.now() }); toast('칭찬 녹음을 저장했어요'); }
  else { S.voices[target] = data; toast(`엄마 목소리 #${MOM_LINES.findIndex(l => l.id === target) + 1}을 저장했어요`); }
  save(); go('adult');
}

function confetti(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('canvas.confetti').forEach(x => x.remove());
  const c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
  setTimeout(() => c.remove(), 3500);
  const ctx = c.getContext('2d'); const W = c.width = innerWidth, H = c.height = innerHeight;
  const cols = ['#FF8FB1','#7FD8BE','#8CC9FF','#FFE08A','#C3ADF2'];
  const ps = Array.from({ length:90 }, () => ({ x:W / 2 + (Math.random() - .5) * 80, y:H * .35, vx:(Math.random() - .5) * 9, vy:-Math.random() * 11 - 3, r:Math.random() * 6 + 4, c:pick(cols), a:Math.random() * 6, s:Math.random() < .5 }));
  let f = 0;
  (function tick(){ ctx.clearRect(0, 0, W, H); ps.forEach(p => { p.vy += .32; p.x += p.vx; p.y += p.vy; p.a += .15; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; if (p.s) { ctx.beginPath(); ctx.arc(0, 0, p.r / 1.6, 0, 7); ctx.fill(); } else ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
    if (++f < 110) requestAnimationFrame(tick); else c.remove(); })();
}

/* 수 모형: 백(10×10 판), 십(막대), 일(작은 정육면체) */
function baseTenSVG(h, t, o, opt = {}){
  const u = opt.unit || 9, gap = 10, pad = 6;
  const hw = u * 10, rows = [];
  let x = pad, svg = '';
  for (let i = 0; i < h; i++) {
    svg += `<g transform="translate(${x} ${pad})"><rect width="${hw}" height="${hw}" rx="3" fill="${C.skyD}" stroke="${C.ink}" stroke-width="2"/>`;
    for (let k = 1; k < 10; k++) svg += `<line x1="${k * u}" y1="0" x2="${k * u}" y2="${hw}" stroke="#BFE0FF" stroke-width="1"/><line x1="0" y1="${k * u}" x2="${hw}" y2="${k * u}" stroke="#BFE0FF" stroke-width="1"/>`;
    svg += '</g>'; x += hw + gap;
  }
  for (let i = 0; i < t; i++) {
    svg += `<g transform="translate(${x} ${pad})"><rect width="${u}" height="${hw}" rx="2" fill="${C.pink}" stroke="${C.ink}" stroke-width="2"/>`;
    for (let k = 1; k < 10; k++) svg += `<line x1="0" y1="${k * u}" x2="${u}" y2="${k * u}" stroke="#FFD0DE" stroke-width="1"/>`;
    svg += '</g>'; x += u + 5;
  }
  if (t) x += gap - 5;
  const oCols = Math.ceil(o / 5);

}

function rulerSVG(start, end, opt = {}){
  const cm = 22, L = opt.len || 15, W = L * cm + 30, x0 = 15;
  let svg = `<rect x="${x0 + start * cm}" y="6" width="${(end - start) * cm}" height="26" rx="6" fill="${opt.color || C.pink}" stroke="${C.ink}" stroke-width="2"/>`;
  if (opt.label) svg += `<text x="${x0 + (start + end) / 2 * cm}" y="24" font-size="13" text-anchor="middle" fill="${C.ink}" font-family="Jua, sans-serif">${opt.label}</text>`;
  svg += `<rect x="4" y="40" width="${W - 8}" height="46" rx="6" fill="#FFF8E6" stroke="${C.ink}" stroke-width="2"/>`;
  for (let i = 0; i <= L * 10; i++) { const x = x0 + i * cm / 10, big = i % 10 === 0, mid = i % 5 === 0; svg += `<line x1="${x}" y1="40" x2="${x}" y2="${40 + (big ? 20 : mid ? 14 : 8)}" stroke="${C.ink}" stroke-width="${big ? 2 : 1}"/>`; if (big) svg += `<text x="${x}" y="78" font-size="13" text-anchor="middle" fill="${C.ink}" font-family="Jua, sans-serif">${i / 10}</text>`; }
  svg += `<line x1="${x0 + start * cm}" y1="32" x2="${x0 + start * cm}" y2="40" stroke="${C.pinkD}" stroke-width="2" stroke-dasharray="3 2"/><line x1="${x0 + end * cm}" y1="32" x2="${x0 + end * cm}" y2="40" stroke="${C.pinkD}" stroke-width="2" stroke-dasharray="3 2"/>`;
  return `<svg class="draw" viewBox="0 0 ${W} 90" width="${W}" style="max-width:100%;height:auto" role="img" aria-label="자">${svg}</svg>`;
}

/* 클립으로 재기 */
function clipsSVG(n, label){
  const cw = 34, W = n * cw + 20; let svg = `<rect x="10" y="6" width="${n * cw}" height="22" rx="6" fill="${C.mint}" stroke="${C.ink}" stroke-width="2"/>`;
  if (label) svg += `<text x="${10 + n * cw / 2}" y="22" font-size="13" text-anchor="middle" fill="${C.ink}" font-family="Jua, sans-serif">${label}</text>`;
  for (let i = 0; i < n; i++) { const x = 10 + i * cw; svg += `<rect x="${x + 2}" y="38" width="${cw - 4}" height="14" rx="7" fill="none" stroke="${C.skyD}" stroke-width="3"/><rect x="${x + 7}" y="42" width="${cw - 14}" height="6" rx="3" fill="none" stroke="${C.skyD}" stroke-width="2"/>`; }
  return `<svg class="draw" viewBox="0 0 ${W} 58" width="${Math.min(W * 1.3, 520)}" style="max-width:100%;height:auto" role="img" aria-label="클립 ${n}개 길이">${svg}</svg>`;
}

/* 칠교판: 정사각형 하나를 일곱 조각으로 (삼각형 5, 사각형 2) */
const TANGRAM = [
  { n:1, k:'tri',  pts:[[0,0],[100,0],[50,50]],          c:'#FF8FB1' },
  { n:2, k:'tri',  pts:[[0,0],[50,50],[0,100]],          c:'#8CC9FF' },
  { n:3, k:'tri',  pts:[[100,0],[100,50],[75,25]],       c:'#FFE08A' },
  { n:4, k:'quad', pts:[[50,50],[75,25],[100,50],[75,75]], c:'#7FD8BE' },
  { n:5, k:'tri',  pts:[[50,50],[75,75],[25,75]],        c:'#C3ADF2' },
  { n:6, k:'quad', pts:[[0,100],[25,75],[75,75],[50,100]], c:'#FFB38A' },
  { n:7, k:'tri',  pts:[[100,50],[100,100],[50,100]],    c:'#F7A8C8' },
];
function tangramSVG(o = {}){
  const size = o.size || 210;
  const body = TANGRAM.map(p => {
    const cx = p.pts.reduce((s, q) => s + q[0], 0) / p.pts.length, cy = p.pts.reduce((s, q) => s + q[1], 0) / p.pts.length;
    const dim = o.hi && o.hi !== p.n;
    return `<polygon points="${p.pts.map(q => q.join(',')).join(' ')}" fill="${dim ? '#F4EEF1' : p.c}" stroke="${C.ink}" stroke-width="1.8" stroke-linejoin="round"/>` +
      (o.nums ? `<circle cx="${cx}" cy="${cy}" r="6.5" fill="#fff" stroke="${C.ink}" stroke-width="1"/><text x="${cx}" y="${cy + 3.3}" font-size="9" text-anchor="middle" font-family="Jua, sans-serif" fill="${C.ink}">${p.n}</text>` : '');
  }).join('');
  return `<svg class="draw" viewBox="-3 -3 106 106" width="${size}" height="${size}" role="img" aria-label="칠교판">${body}</svg>`;
}
/* 작은 삼각형 두 조각을 붙여 만든 모양 */
function twoTriSVG(kind, size = 90){
  const shapes = {
    square:[[[0,0],[60,0],[0,60]], [[60,0],[60,60],[0,60]]],
    tri:[[[0,60],[60,60],[60,0]], [[60,0],[60,60],[120,60]]],
    para:[[[0,60],[40,0],[40,60]], [[40,0],[80,0],[40,60]]],
  }[kind];
  const W = kind === 'tri' ? 120 : kind === 'para' ? 80 : 60;
  return `<svg class="draw" viewBox="-4 -4 ${W + 8} 68" width="${size * (W + 8) / 68}" height="${size}" aria-hidden="true">${shapes.map((p, i) => `<polygon points="${p.map(q => q.join(',')).join(' ')}" fill="${i ? '#C3ADF2' : '#FFE08A'}" stroke="${C.ink}" stroke-width="2.5" stroke-linejoin="round"/>`).join('')}</svg>`;
}

/* 묶음 그림 (곱셈) */

/* 수를 한글로 읽기 (1~9999) */
const KDIG = ['','일','이','삼','사','오','육','칠','팔','구'];
function numKo(n){
  if (n === 0) return '영';
  const units = [[1000,'천'],[100,'백'],[10,'십'],[1,'']]; let s = '';
  for (const [u, name] of units) { const d = Math.floor(n / u) % 10; if (!d) continue; s += (d === 1 && u > 1 ? '' : KDIG[d]) + name; }
  return s;
}

    const step = pick([2, 3, 4, 5, 10]), start = step, seq = [0, 1, 2, 3, 4].map(i => start + step * i), hole = rnd(3, 4);
    return nq(`c:skc${step}h${hole}`, 'skip', `${step}씩 뛰어 세어요. 빈칸에 알맞은 수는?`, `${step}씩 뛰어 세어요`, eqH(seq.map((x, i) => i === hole ? QB : x).join(', '), true), seq[hole], `${step}씩 커져요`, seq.join(', ')); },

    const a = rnd(2, 5), b = rnd(2, 5); const [e] = pick(COUNT_THINGS);
    return nq(`c:bae${a}x${b}`, 'bae', `${a}씩 ${b}묶음은 ${a}의 몇 배일까요?`, null, groupsHTML(e, b, a), b, '묶음의 수를 세어 봐요', `${a}씩 ${b}묶음은 ${a}의 ${b}배`); },
  '6-4'(){ const a = rnd(2, 6), b = rnd(2, 5); const [e] = pick(COUNT_THINGS);
    const right = `${a} × ${b}`, opts = new Set([right]); for (const w of shuffle([`${a} + ${b}`, `${a + 1} × ${b}`, `${a} × ${b + 1}`])) { if (opts.size < 3) opts.add(w); }
    return cq(`c:mx${a}x${b}`, 'mulexpr', '그림을 곱셈식으로 나타내면?', `${a}씩 ${b}묶음을 곱셈식으로 나타내 봐요`, groupsHTML(e, b, a), [...opts], right, `한 묶음에 ${a}개, ${b}묶음이에요. "${a}씩 ${b}묶음"은 ${a} × ${b}`, `${a}씩 ${b}묶음 = ${a} × ${b}`, { cols:1 }); },

};

function qMagic(id){ const [w, k, e, short] = pick(MAGIC[id]); const v = w.match(/[aeiou]/)[0], other = w.replace(v, v === 'a' ? 'o' : 'a');
